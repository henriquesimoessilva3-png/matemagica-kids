<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="darkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0f2d"/>
      <stop offset="0.55" stop-color="#1a1f4a"/>
      <stop offset="1" stop-color="#2d1b4e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe082"/>
      <stop offset="0.5" stop-color="#f5b731"/>
      <stop offset="1" stop-color="#c18b0a"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="1000" height="1000" fill="url(#darkBg)"/>

  <!-- Subtle grid (notebook vibe, very faint) -->
  <g opacity="0.06" stroke="#fff" stroke-width="1">
    <line x1="0" y1="200" x2="1000" y2="200"/>
    <line x1="0" y1="400" x2="1000" y2="400"/>
    <line x1="0" y1="600" x2="1000" y2="600"/>
    <line x1="0" y1="800" x2="1000" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
    <line x1="800" y1="0" x2="800" y2="1000"/>
  </g>

  <!-- Stars sparse -->
  <circle cx="150" cy="150" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="880" cy="220" r="1.5" fill="#fff" opacity="0.7"/>
  <circle cx="100" cy="600" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="910" cy="750" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="300" cy="880" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="700" cy="130" r="1.5" fill="#fff" opacity="0.6"/>

  <!-- Top small category label -->
  <text x="500" y="180" text-anchor="middle" font-size="24" font-family="Arial, sans-serif" font-weight="700" fill="#f5b731" letter-spacing="6">EDUCAÇÃO · 1º AO 5º ANO</text>

  <!-- Thin gold divider -->
  <rect x="400" y="210" width="200" height="2" fill="url(#goldGrad)" opacity="0.8"/>

  <!-- Brand name massive -->
  <text x="500" y="380" text-anchor="middle" font-size="130" font-family="Georgia, 'Times New Roman', serif" font-weight="900" fill="#fff" letter-spacing="-2" filter="url(#softGlow)">Matemágica</text>

  <!-- Tagline -->
  <text x="500" y="450" text-anchor="middle" font-size="34" font-family="Georgia, serif" font-style="italic" font-weight="400" fill="#d0c8e8">— matemática sem medo de errar —</text>

  <!-- Big price card -->
  <g transform="translate(250,540)">
    <rect x="0" y="0" width="500" height="200" rx="16" fill="#fff" opacity="0.06" stroke="url(#goldGrad)" stroke-width="2"/>
    <text x="250" y="60" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" font-weight="600" fill="#d0c8e8" letter-spacing="3">ACESSO VITALÍCIO</text>
    <text x="250" y="150" text-anchor="middle" font-size="110" font-family="Georgia, serif" font-weight="900" fill="url(#goldGrad)" filter="url(#softGlow)">R$ 17</text>
    <text x="250" y="185" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="500" fill="#d0c8e8" letter-spacing="2">PAGAMENTO ÚNICO · SEM MENSALIDADE</text>
  </g>

  <!-- Bottom list of features -->
  <g transform="translate(180,810)" font-family="Arial, sans-serif" fill="#d0c8e8">
    <text x="0" y="0" font-size="22" font-weight="600">✓ Alinhado à BNCC</text>
    <text x="0" y="40" font-size="22" font-weight="600">✓ Jogos por ano escolar</text>
    <text x="400" y="0" font-size="22" font-weight="600">✓ Pokédex de Tabuada</text>
    <text x="400" y="40" font-size="22" font-weight="600">✓ PDFs imprimíveis</text>
  </g>
</svg>
