  <!-- Boaler 2.2.2: filtros escondidos atrás de "Modo de prática". Padrão: misturado -->
  <div style="text-align:center;margin-bottom:12px">

        <label style="display:flex;align-items:center;gap:8px;padding:8px 10px;border:2px solid #c5bbe9;border-radius:10px;cursor:pointer;font-size:14px;color:#4a3b8a"><input type="radio" name="op-rad" value="multiplicacao"> ✖️ Só multiplicar</label>

        <button onclick="fecharModoPratica()" style="background:#f7f5ff;color:#888;border:2px solid #c5bbe9;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit">Cancelar</button>

<script>
STORAGE_KEY = 'jogosMat_default';
CAPS = {}; TUTORIAIS = {}; JOGOS = {}; DICAS = {};

// ============== BANCO PARAMETRIZÁVEL BR ==============
const NOMES = ['Ana', 'Bia', 'Caio', 'Davi', 'Elisa', 'João', 'Luiza', 'Mateus', 'Rafa', 'Sofia', 'Léo', 'Helena', 'Gabi', 'Pedro', 'Val', 'Lucas', 'Maria', 'Nina'];
const OBJETOS = {
  pequenos: ['lápis', 'borracha', 'figurinha', 'moeda', 'bala', 'botão', 'caneta', 'giz'],
  medios:   ['livro', 'bolacha', 'brigadeiro', 'maçã', 'laranja', 'sanduíche', 'carrinho', 'boneca'],
  grandes:  ['bola de futebol', 'pipa', 'garrafa', 'travesseiro', 'mochila', 'pote', 'caixa de giz']
};
const RECIPIENTES = ['caixa', 'pacote', 'saco', 'sacola', 'mochila', 'pote', 'estojo', 'gaveta'];
const LUGARES = ['na sala', 'no recreio', 'na festa', 'no parque', 'em casa', 'na padaria', 'na escola'];

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function rint(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

// ============== GERADORES DE PROBLEMAS POR OPERAÇÃO ==============
const GERADORES = {
  soma: () => {
    const nome = pick(NOMES);
    const obj = pick(OBJETOS.pequenos);
    const a = rint(3, 20);
    const b = rint(2, 15);
    const res = a + b;
    return {
      texto: `${nome} tinha <b>${a} ${obj}${obj.endsWith('s') ? '' : 's'}</b> ${pick(LUGARES)}. De presente, ganhou mais <b>${b} ${obj}${obj.endsWith('s') ? '' : 's'}</b>.`,
      pergunta: `Quantos ${obj}${obj.endsWith('s') ? '' : 's'} ${nome} tem agora?`,
      resposta: res,
      tipo: 'soma'
    };
  },
  subtracao: () => {
    const nome = pick(NOMES);
    const obj = pick(OBJETOS.pequenos);
    const a = rint(15, 40);
    const b = rint(3, a - 2);
    const res = a - b;
    const verbos = ['deu', 'perdeu', 'usou', 'trocou'];
    return {
      texto: `${nome} tinha <b>${a} ${obj}${obj.endsWith('s') ? '' : 's'}</b>. Em uma tarde, ${pick(verbos)} <b>${b}</b>.`,
      pergunta: `Quantos ${obj}${obj.endsWith('s') ? '' : 's'} sobraram com ${nome}?`,
      resposta: res,
      tipo: 'subtracao'
    };
  },
  multiplicacao: () => {
    const nome = pick(NOMES);
    const obj = pick(OBJETOS.medios);
    const recipiente = pick(RECIPIENTES);
    const a = rint(2, 8);
    const b = rint(2, 9);
    const res = a * b;
    return {
      texto: `${nome} organizou <b>${a} ${recipiente}${recipiente.endsWith('s') ? '' : 's'}</b> de ${obj}${obj.endsWith('s') ? '' : 's'}. Em cada ${recipiente} colocou <b>${b} ${obj}${obj.endsWith('s') ? '' : 's'}</b>.`,
      pergunta: `Quantos ${obj}${obj.endsWith('s') ? '' : 's'} ${nome} tem no total?`,
      resposta: res,
      tipo: 'multiplicacao'
    };
  },
  divisao: () => {
    const nome = pick(NOMES);
    const obj = pick(OBJETOS.medios);
    const nAmigos = rint(2, 6);
    const perCada = rint(2, 8);
    const total = nAmigos * perCada;
    return {
      texto: `${nome} tem <b>${total} ${obj}${obj.endsWith('s') ? '' : 's'}</b> pra repartir igualzinho entre <b>${nAmigos} amigos</b>.`,
      pergunta: `Quantos ${obj}${obj.endsWith('s') ? '' : 's'} cada amigo recebe?`,
      resposta: perCada,
      tipo: 'divisao'
    };
  },
  mix: null // tratado em gerarProblema
};

let _opAtual = 'mix'; // Boaler 2.2.1: default misturado (criança triagra a operação)
let _probAtual = null;
let _acertos = 0;
let _rodada = 0;

function setOp(op) {
  _opAtual = op;
  const nomes = { soma: '➕ Só somar', subtracao: '➖ Só subtrair', multiplicacao: '✖️ Só multiplicar', divisao: '➗ Só dividir', mix: '🎲 Variados' };
  document.getElementById('hud-op').textContent = nomes[op];
  const lbl = document.getElementById('op-label-atual');
  if (lbl) lbl.textContent = nomes[op];
}

function abrirModoPratica() {
  const m = document.getElementById('modo-pratica-modal');
  m.style.display = 'flex';
  // marca o atual
  const r = m.querySelector(`input[name="op-rad"][value="${_opAtual}"]`);
  if (r) r.checked = true;
}
function fecharModoPratica() { document.getElementById('modo-pratica-modal').style.display = 'none'; }
function aplicarModoPratica() {
  const sel = document.querySelector('input[name="op-rad"]:checked');
  if (sel) setOp(sel.value);
  fecharModoPratica();
  gerarProblema();
}

function gerarProblema() {
  const op = _opAtual === 'mix'
    ? pick(['soma', 'subtracao', 'multiplicacao', 'divisao'])
    : _opAtual;
  _probAtual = GERADORES[op]();
  _rodada++;
  document.getElementById('historia-texto').innerHTML = _probAtual.texto;
  document.getElementById('historia-pergunta').innerHTML = `${_probAtual.pergunta} <span style="color:#888;font-size:13px;display:block;margin-top:4px;font-weight:normal;font-style:italic">Dica: pensa como se fosse de verdade.</span>`;
  document.getElementById('historia-pergunta').classList.remove('hidden');
  document.getElementById('prob-feedback').textContent = '';
  document.getElementById('prob-feedback').className = 'prob-feedback';
  // Gera 4 opções com a certa + 3 distratoras próximas
  const certa = _probAtual.resposta;
  const set = new Set([certa]);
  while (set.size < 4) {
    const delta = rint(-4, 4);
    const v = Math.max(0, certa + delta);
    if (v !== certa) set.add(v);
  }
  const arr = Array.from(set).sort((a, b) => a - b);
  document.getElementById('prob-opcoes').innerHTML = arr.map(v =>
    `<button onclick="responder(${v}, this)">${v}</button>`
  ).join('') + `<button class="btn-me-explica-inline" style="grid-column:span 2;margin-top:6px" onclick="abrirExplicaELI5('${_probAtual.tipo}')">💡 Me explica</button>`;
  atualizarHUD();
  document.getElementById('btn-novo').textContent = '🎲 Próximo';
}

function responder(v, btn) {
  const botoes = document.querySelectorAll('.prob-opcoes > button');
  botoes.forEach(b => b.disabled = true);
  const fb = document.getElementById('prob-feedback');
  if (v === _probAtual.resposta) {
    _acertos++;
    btn.classList.add('acerto');
    try { somAcerto(); } catch(e) {}
    try {
      jogoAtivo = 'problemas_' + _probAtual.tipo;
      STATE.acertou(jogoAtivo);
      renderHeaderPlayer();
      window._acertosSessao = (window._acertosSessao || 0) + 1;
      if (window._acertosSessao % 5 === 0 && typeof mostrarCapsulaMundoReal === 'function') {
        setTimeout(mostrarCapsulaMundoReal, 1200);
      }
    } catch(e) {}
    fb.className = 'prob-feedback acerto';
    fb.innerHTML = `✨ Isso! ${_probAtual.resposta} ${getObjeto(_probAtual.texto)}. ${fraseSorteada(FRASES_ACERTO)}`;
    try { soltarConfete(20); reagirMascoteCoach('acerto'); } catch(e) {}
    // Boaler 2.2.3: oferece reflexão sobre a estratégia (opcional, não bloqueia)
    setTimeout(() => mostrarComoPensou(), 600);
  } else {
    btn.classList.add('erro');
    botoes.forEach(b => { if (parseInt(b.textContent) === _probAtual.resposta) b.classList.add('acerto'); });
    try { somErro(); } catch(e) {}
    try {
      jogoAtivo = 'problemas_' + _probAtual.tipo;
      STATE.errou(jogoAtivo);
      reagirMascoteCoach('erro');
    } catch(e) {}
    fb.className = 'prob-feedback erro';
    fb.innerHTML = `Respira. A resposta era <b>${_probAtual.resposta}</b>. Tenta o próximo — cada erro ensina.`;
    // "Como meu filho pensou?" — hipótese do erro
    try {
      const txt = _probAtual.texto.replace(/<[^>]+>/g, '');
      const nums = (txt.match(/\d+/g) || []).map(Number);
      const a = nums[0], b = nums[1];
      if (a != null && b != null && typeof mostrarHipoteseErroInline === 'function') {
        mostrarHipoteseErroInline({ a, b, op: _probAtual.tipo, esperado: _probAtual.resposta, errado: v }, '#prob-feedback');
      }
    } catch(e) {}
  }
  atualizarHUD();
}

function getObjeto(texto) {
  // tenta extrair o objeto principal do texto (depois de "ganhou", "deu" etc) — quick and dirty
  const match = texto.match(/<b>(\d+) ([^<]+)<\/b>/);
  return match ? match[2] : '';
}

function atualizarHUD() {
  document.getElementById('hud-acertos').textContent = _acertos;
  document.getElementById('hud-rodada').textContent = _rodada;
}

// Boaler 2.2.3: "Como você pensou?" — pergunta opcional sobre estratégia depois de cada acerto.
// Estratégias relatadas alimentam o contador "Estratégias" da home (Boaler 1.2.2).
const ESTRATEGIAS_KEY = 'matemagica_estrategias_v1';
function carregarEstrategiasUsadas() {
  try { return JSON.parse(localStorage.getItem(ESTRATEGIAS_KEY) || '{"usadas":{},"inventadas":[]}'); }
  catch(e) { return { usadas: {}, inventadas: [] }; }
}
function salvarEstrategiasUsadas(d) {
  try { localStorage.setItem(ESTRATEGIAS_KEY, JSON.stringify(d)); } catch(e) {}
}

function mostrarComoPensou() {
  const cont = document.getElementById('prob-feedback');
  if (!cont) return;
  const ja = document.getElementById('como-pensou-card');
  if (ja) ja.remove();
  const card = document.createElement('div');
  card.id = 'como-pensou-card';
  card.style.cssText = 'background:#f7f5ff;border:2px dashed #c5bbe9;border-radius:12px;padding:12px;margin-top:10px;text-align:left';
  card.innerHTML = `
    <div style="font-size:13px;font-weight:700;color:#4a3b8a;margin-bottom:8px">✏️ Como você pensou? <span style="font-weight:400;color:#888;font-size:11px">(opcional)</span></div>
    <div style="display:grid;gap:5px">
      ${[
        ['somar_tudo', '➕ Eu somei tudo de uma vez'],
        ['separar_partes', '🧩 Eu separei em partes'],
        ['desenhei', '✏️ Eu desenhei'],
        ['cabeca', '🧠 Eu fiz de cabeça'],
        ['outro', '💭 Outro jeito']
      ].map(([k, l]) => `<button onclick="registrarEstrategia('${k}')" style="text-align:left;background:#fff;border:2px solid #c5bbe9;color:#4a3b8a;padding:7px 10px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">${l}</button>`).join('')}
    </div>
  `;
  cont.parentNode.insertBefore(card, cont.nextSibling);
}

function registrarEstrategia(chave) {
  const d = carregarEstrategiasUsadas();
  d.usadas[chave] = (d.usadas[chave] || 0) + 1;
  salvarEstrategiasUsadas(d);
  const card = document.getElementById('como-pensou-card');
  if (card) card.innerHTML = `<div style="text-align:center;font-size:13px;color:#1b7a3a;font-weight:700;padding:6px">✨ Anotado! Você já usou ${Object.keys(d.usadas).length} jeito${Object.keys(d.usadas).length>1?'s':''} diferente${Object.keys(d.usadas).length>1?'s':''}.</div>`;
}

// Init
initJogos();
atualizarHUD();
setOp('mix');
gerarProblema();
</script>
<script>
