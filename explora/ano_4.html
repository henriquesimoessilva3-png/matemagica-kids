  /* ===== CAPÍTULOS (cards maiores) ===== */
  .capitulos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
    margin-top: 8px;
  }
  .cap-card {
    background: #fff4dc;

    border-radius: 16px;
    padding: 14px 14px 12px;
    cursor: pointer;
    transition: all 0.22s;
    text-align: left;

    position: relative;
    display: flex; flex-direction: column; gap: 4px;
  }
  .cap-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 18px rgba(139, 90, 43, 0.3);
    border-color: #8b5a2b;
  }
  .cap-card .cap-rotulo {
    font-size: 11px; letter-spacing: 1px;
    text-transform: uppercase; font-weight: 800;
    color: #8b5a2b; margin-bottom: 2px;
  }
  .cap-card .cap-nome {
    font-size: 16px; font-weight: 800; color: #3a2818;
    line-height: 1.25;
  }
  .cap-card .cap-desc {
    font-size: 12px; color: #6b3a15; line-height: 1.35;
    margin-top: 4px;
  }
  .cap-card .cap-stats {
    font-size: 12px; color: #6b3a15; font-weight: 700;
    margin-top: 8px; display: flex; gap: 10px; align-items: center;
  }
  .cap-card .cap-progresso-bar {
    margin-top: 6px; height: 6px; border-radius: 4px;
    background: #fef8ed; overflow: hidden;
    border: 1px solid #c9a86b;
  }
  .cap-card .cap-progresso-fill {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, #d4a574, #8b5a2b);
    transition: width 0.5s;
  }
  .cap-card .cap-num {
    position: absolute; top: -10px; right: -10px;
    background: linear-gradient(135deg, #8b5a2b, #b88247);
    color: #fff; width: 34px; height: 34px;
    border-radius: 50%; border: 3px solid #fef8ed;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.2);

  .cap-card.h2 { background: linear-gradient(135deg, #ffe8ba, #ffd58c); border-color: #d4a574; }
  .cap-card.h3 { background: linear-gradient(135deg, #e8ddc0, #c9b585); border-color: #b8945a; }

  .cap-card.g4 { background: linear-gradient(135deg, #ebdff5, #c8a8e0); border-color: #7a4aa8; }

    grid-column: 1 / -1;
    font-size: 13px; font-weight: 800;
    color: #6b3a15; letter-spacing: 1.5px;

    padding: 6px 0 2px;
    border-bottom: 2px dashed #c9a86b;
    margin-top: 6px;

  .breadcrumb {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 10px; flex-wrap: wrap;

  .breadcrumb .crumb {
    background: #fff4dc; padding: 5px 11px;

  .cap-titulo {
    font-size: 19px; font-weight: 800; color: #3a2818;

    display: block; font-size: 13px; color: #8b5a2b;

// =====================================================
// RENDER / NAVEGAÇÃO
// =====================================================
let ABA_ATUAL = 'todos';
let CAP_ATUAL = null;

function capsFiltrados() {
  const arr = Object.entries(CAPS)
    .filter(([k, c]) => ABA_ATUAL === 'todos' || c.materia === ABA_ATUAL)
    .sort((a, b) => a[1].ord - b[1].ord);
  return arr;
}

function progressoCap(capKey) {
  const cap = CAPS[capKey];
  let acertos = 0, erros = 0, tentativas = 0;
  let total = 0;
  cap.jogos.forEach(jid => {
    const jogo = JOGOS.find(j => j.id === jid);
    if (!jogo) return;
    const totalPerg = (jogo.perguntas || []).length;
    total += totalPerg;
    const p = STATE.jogos[jid];
    if (p) {
      acertos += p.acertos || 0;
      erros += p.erros || 0;
      tentativas += (p.acertos || 0) + (p.erros || 0);
    }
  });
  return { acertos, erros, tentativas, total };
}

function renderCapitulos() {
  const cont = document.getElementById('capitulos-container');
  const caps = capsFiltrados();
  let html = '';
  let ultimaMateria = null;
  caps.forEach(([k, c]) => {
    if (ABA_ATUAL === 'todos' && c.materia !== ultimaMateria) {
      ultimaMateria = c.materia;
      const nome = c.materia === 'historia' ? '📜 HISTÓRIA' : '🗺️ GEOGRAFIA';
      html += `<div class="cap-separador">${nome}</div>`;
    }
    const p = progressoCap(k);
    const pct = p.total > 0 ? Math.min(100, Math.round((p.acertos / p.total) * 100)) : 0;
    html += `
      <button class="cap-card ${k}" onclick="abrirCapitulo('${k}')">
        <span class="cap-num">${c.num}</span>
        <div class="cap-rotulo">Capítulo ${c.num} · ${c.materia === 'historia' ? 'História' : 'Geografia'}</div>
        <div class="cap-nome">${c.nome}</div>
        <div class="cap-desc">${c.desc}</div>
        <div class="cap-progresso-bar"><div class="cap-progresso-fill" style="width:${pct}%"></div></div>
        <div class="cap-stats">
          <span>🎮 ${c.jogos.length} jogos</span>
          <span>⭐ ${p.acertos}/${p.total}</span>
        </div>
      </button>
    `;
  });
  cont.innerHTML = html;
}

function abrirCapitulo(k) {
  CAP_ATUAL = k;
  const c = CAPS[k];
  document.getElementById('tela-capitulos').style.display = 'none';
  document.getElementById('tela-jogos-cap').style.display = 'block';
  document.getElementById('breadcrumb-cap').textContent = `Cap. ${c.num} · ${c.materia === 'historia' ? 'História' : 'Geografia'}`;
  document.getElementById('cap-titulo').innerHTML = `${c.nome}<span class="cap-sub">${c.desc}</span>`;
  const cont = document.getElementById('grid-container');
  cont.innerHTML = c.jogos.map(jid => {
    const j = JOGOS.find(x => x.id === jid);
    if (!j) return '';
    const p = STATE.jogos[j.id] || { acertos: 0, erros: 0 };
    const total = (j.perguntas || []).length;
    return `
      <div class="jogo-card" onclick="iniciarJogo('${j.id}')">
        <div class="emoji">${j.emoji}</div>
        <div class="titulo">${j.titulo}</div>
        <div class="desc">${j.desc}</div>
        <div class="progresso">
          ${p.acertos + p.erros > 0
            ? `<span class="estrelas">⭐ ${p.acertos}/${total}</span>`
            : `<span style="color:#8b5a2b">🎯 ${total} perguntas</span>`}
        </div>
      </div>`;
  }).join('');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function voltarCapitulos() {
  CAP_ATUAL = null;
  document.getElementById('tela-jogos-cap').style.display = 'none';
  document.getElementById('tela-capitulos').style.display = 'block';
  renderCapitulos();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function iniciarJogo(id) {
  const jogo = JOGOS.find(j => j.id === id);
  if (jogo) abrirJogo(jogo);
}

// Explora_shared chama atualizarGridProgresso quando volta do jogo
function atualizarGridProgresso() {
  if (CAP_ATUAL) abrirCapitulo(CAP_ATUAL);
  else renderCapitulos();
}

// voltarGrid (chamado pelo shared) — volta para a lista de jogos do capítulo (ou, se não tiver, pros capítulos)
const _origVoltarGrid = voltarGrid;
voltarGrid = function() {
  document.getElementById('tela-jogo').style.display = 'none';
  if (CAP_ATUAL) {
    document.getElementById('tela-jogos-cap').style.display = 'block';
    abrirCapitulo(CAP_ATUAL);
  } else {
    document.getElementById('tela-capitulos').style.display = 'block';
    renderCapitulos();
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

document.querySelectorAll('.aba').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.aba').forEach(x => x.classList.remove('ativa'));
    b.classList.add('ativa');
    ABA_ATUAL = b.dataset.aba;
    CAP_ATUAL = null;
    document.getElementById('tela-jogo').style.display = 'none';
    document.getElementById('tela-jogos-cap').style.display = 'none';
    document.getElementById('tela-capitulos').style.display = 'block';
    renderCapitulos();
  });
});

renderCapitulos();
</script>
