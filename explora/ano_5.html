<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EXPLORA · 5º Ano</title>
<link rel="stylesheet" href="historia_shared.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8a4a8a">
<style>
  .topo-ano { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
  .topo-ano h1 { font-size: 22px; margin: 0; flex: 1; text-align: center; }
  .abas { display: flex; gap: 6px; justify-content: center; margin: 8px 0 14px; flex-wrap: wrap; }
  .aba {
    background: #fff4dc; border: 2px solid #c9a86b;
    color: #6b3a15; padding: 8px 14px; border-radius: 18px;
    font-size: 13px; font-weight: 700; cursor: pointer;
    font-family: inherit;
  }
  .aba.ativa { background: linear-gradient(135deg, #8b5a2b, #b88247); color: #fff; border-color: #6b3a15; }
  .aba:hover:not(.ativa) { border-color: #8b5a2b; }
</style>
</head>
<body>
<div class="container">
  <div class="topo-ano">
    <a href="index.html" class="btn-voltar">← Anos</a>
    <h1>5º Ano · Brasil, Regiões e Povos</h1>
    <span style="width:60px"></span>
  </div>

  <div id="explora-header" class="header-player"></div>

  <div class="abas">
    <button class="aba ativa" data-aba="todos">🎯 Todos</button>
    <button class="aba" data-aba="historia">📜 História</button>
    <button class="aba" data-aba="geografia">🗺️ Geografia</button>
  </div>

  <div id="tela-grid"><div class="jogos-grid" id="grid-container"></div></div>
  <div id="tela-jogo" class="jogo-area" style="display:none"></div>
</div>

<script src="mascotes.js"></script>
<script src="explora_shared.js?v=5"></script>
<script>
initExplora({ storageKey: 'explora_ano5_v1' });
let ABA_ATUAL = 'todos';

  {

    tipo: 'quiz', materia: 'historia',
    perguntas: [

        opcoes: ['Povos indígenas', 'Italianos', 'Japoneses', 'Nenhum povo'],
        correta: 0,

      { pergunta: 'Em que século os portugueses chegaram ao Brasil?',
        opcoes: ['Século XVI (ano 1500)', 'Século X', 'Século XXI', 'Século VIII'],
        correta: 0,
        explica: '22 de abril de 1500 — a frota de Pedro Álvares Cabral aportou no que hoje é a Bahia.' },
      { pergunta: 'Onde ficam as raízes da maioria dos africanos trazidos ao Brasil à força durante a escravidão?',
        opcoes: [
          'Oeste e centro da África (atuais Angola, Nigéria, Benin, Moçambique…)',
          'Norte da Europa',
          'Leste asiático',

        correta: 0,
        explica: 'Diversos povos africanos foram escravizados e trazidos, como iorubás, bantos e muitos outros.' },

                 'Só da África', 'Só dos Estados Unidos', 'De nenhum lugar'],
        correta: 0,
        explica: 'Entre fim do século XIX e início do XX, milhões de imigrantes europeus e asiáticos chegaram ao Brasil.' },
      { pergunta: 'O que é cidadania?',
        opcoes: [
          'Conjunto de direitos e deveres das pessoas que vivem em um país',
          'Só quem tem dinheiro',
          'Só os adultos',
          'Só quem mora na cidade'
        ],
        correta: 0,
        explica: 'Cidadão é quem tem direitos (educação, saúde, voto) e deveres (respeitar leis, pagar impostos quando adulto).' }
    ]
  },
  {
    id: 'regioes', emoji: '🗺️', titulo: '5 Regiões do Brasil',
    desc: 'Norte, Nordeste, Centro-Oeste, Sudeste e Sul.',
    tipo: 'quiz', materia: 'geografia',
    perguntas: [
      { pergunta: 'Quantas regiões tem o Brasil?',
        opcoes: ['5', '3', '7', '27'],
        correta: 0,
        explica: 'Norte, Nordeste, Centro-Oeste, Sudeste e Sul. São 27 estados distribuídos nessas 5 regiões.' },
      { pergunta: 'Em qual região fica a Floresta Amazônica?',
        opcoes: ['Norte', 'Sul', 'Sudeste', 'Nordeste'],
        correta: 0,
        explica: 'A região Norte concentra a maior parte da Floresta Amazônica brasileira.' },
      { pergunta: 'Qual região tem estados como Ceará, Pernambuco e Bahia?',
        opcoes: ['Nordeste', 'Sul', 'Centro-Oeste', 'Norte'],
        correta: 0,
        explica: 'O Nordeste tem 9 estados: MA, PI, CE, RN, PB, PE, AL, SE, BA.' },
      { pergunta: 'Qual região concentra mais indústrias e habitantes do Brasil?',
        opcoes: ['Sudeste', 'Centro-Oeste', 'Norte', 'Sul'],
        correta: 0,

      { pergunta: 'A capital federal do Brasil, Brasília, fica em qual região?',

    ]
  },
  {
    id: 'estados_regiao', emoji: '📍', titulo: 'Estados por Região',
    desc: 'Onde cada estado se encaixa.',
    tipo: 'classif', materia: 'geografia',
    perguntas: [
      {
        pergunta: 'Em qual região fica cada estado?',
        hint: 'NE tem muito litoral e cultura do sertão. SE é o mais populoso.',
        bucketA: { label: 'Nordeste', emoji: '🌊' },

        explica: 'Nordeste: BA, CE, PE, MA, PI, RN, PB, AL, SE. Sudeste: SP, RJ, MG, ES.'
      },
      {
        pergunta: 'Norte ou Sul?',
        bucketA: { label: 'Norte', emoji: '🌳' },
        bucketB: { label: 'Sul', emoji: '❄️' },
        itens: [
          { id: 'i1', label: 'Amazonas (AM)' },
          { id: 'i2', label: 'Rio Grande do Sul (RS)' },
          { id: 'i3', label: 'Pará (PA)' },
          { id: 'i4', label: 'Paraná (PR)' },
          { id: 'i5', label: 'Santa Catarina (SC)' },
          { id: 'i6', label: 'Acre (AC)' }
        ],
        gabarito: { i1: 'a', i2: 'b', i3: 'a', i4: 'b', i5: 'b', i6: 'a' },
        explica: 'Norte tem 7 estados amazônicos. Sul tem só 3: PR, SC, RS.'
      }
    ]
  },
  {
    id: 'tipos_mapa', emoji: '🗺️', titulo: 'Tipos de Mapa',
    desc: 'Para que serve cada tipo.',
    tipo: 'quiz', materia: 'geografia',
    perguntas: [
      { pergunta: 'Um mapa POLÍTICO mostra principalmente:',
        opcoes: ['Fronteiras entre países e estados',
                 'Montanhas e rios', 'Temperatura', 'Estrelas no céu'],
        correta: 0,

      { pergunta: 'Um mapa FÍSICO mostra:',

      { pergunta: 'Mapa TEMÁTICO serve para:',
        opcoes: [

          'Não serve para nada'
        ],
        correta: 0,
        explica: 'Pode ter mapa de chuvas, de densidade populacional, de plantio — cada um com um tema.' },
      { pergunta: 'A "rosa dos ventos" em um mapa indica:',
        opcoes: ['Os pontos cardeais (N, S, L, O)',
                 'Temperatura', 'O preço', 'A data'],
        correta: 0,
        explica: 'A rosa dos ventos mostra a orientação do mapa — sem ela, é difícil saber para qual lado é o norte.' },
      { pergunta: 'O que é a ESCALA de um mapa?',
        opcoes: [
          'A relação entre o tamanho do mapa e o tamanho real do terreno',
          'Uma régua para medir altura',
          'O nome do criador do mapa',
          'O ano em que o mapa foi feito'
        ],
        correta: 0,
        explica: 'Se a escala é 1:100.000, cada 1cm no mapa vale 100.000cm na realidade (1 km).' }
    ]
  }
];

function renderGrid() {
  const cont = document.getElementById('grid-container');
  const jogos = JOGOS.filter(j => ABA_ATUAL === 'todos' || j.materia === ABA_ATUAL);
  if (jogos.length === 0) {
    cont.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#8b5a2b;padding:24px">Nenhum jogo nessa matéria ainda.</div>';
    return;
  }
  cont.innerHTML = jogos.map(j => {
    const p = STATE.jogos[j.id] || { acertos: 0, erros: 0 };
    return `
    <div class="jogo-card" onclick="iniciarJogo('${j.id}')">
      <div class="emoji">${j.emoji}</div>
      <div class="titulo">${j.titulo}</div>
      <div class="desc">${j.desc}</div>
      <div class="progresso">${p.acertos > 0 ? `<span class="estrelas">⭐ ${p.acertos}</span>` : '🎯 Bora!'}</div>
    </div>`;
  }).join('');
}

function iniciarJogo(id) {
  const jogo = JOGOS.find(j => j.id === id);
  if (jogo) abrirJogo(jogo);
}

function atualizarGridProgresso() { renderGrid(); }

document.querySelectorAll('.aba').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.aba').forEach(x => x.classList.remove('ativa'));
    b.classList.add('ativa');
    ABA_ATUAL = b.dataset.aba;
    renderGrid();
  });
});

renderGrid();
</script>
</body>
</html>
