// =====================================================
// RENDER — capítulos
// =====================================================
let ABA_ATUAL = 'todos';
let CAP_ATUAL = null;

function listaCapsFiltrada() {
  const arr = Object.entries(CAPS).map(([k, c]) => ({ k, ...c }));
  arr.sort((a, b) => a.ord - b.ord);
  if (ABA_ATUAL === 'todos') return arr;
  return arr.filter(c => c.materia === ABA_ATUAL);
}

function renderCapitulos() {
  document.getElementById('tela-capitulos').style.display = 'block';
  document.getElementById('tela-jogos-cap').style.display = 'none';
  document.getElementById('tela-jogo').style.display = 'none';
  const cont = document.getElementById('capitulos-container');
  const caps = listaCapsFiltrada();
  const porMat = { historia: caps.filter(c => c.materia === 'historia'),
                   geografia: caps.filter(c => c.materia === 'geografia') };
  let html = '';
  if (ABA_ATUAL !== 'geografia' && porMat.historia.length) {
    html += '<div class="cap-separador">📜 História</div>';
    html += porMat.historia.map(c => cardCap(c)).join('');
  }
  if (ABA_ATUAL !== 'historia' && porMat.geografia.length) {
    html += '<div class="cap-separador">🗺️ Geografia</div>';
    html += porMat.geografia.map(c => cardCap(c)).join('');
  }
  cont.innerHTML = html || '<div style="text-align:center;color:#8b5a2b;padding:24px">Nenhum capítulo nessa matéria.</div>';
}

function cardCap(c) {
  const jogos = c.jogos.map(id => JOGOS.find(j => j.id === id)).filter(Boolean);
  const totalPerg = jogos.reduce((s, j) => s + (j.perguntas?.length || 0), 0);
  const acertos = jogos.reduce((s, j) => s + (STATE.jogos[j.id]?.acertos || 0), 0);
  const pct = totalPerg ? Math.min(100, Math.round((acertos / totalPerg) * 100)) : 0;
  return `
    <div class="cap-card ${c.k}" onclick="abrirCapitulo('${c.k}')">
      <div class="cap-num">${c.num}</div>
      <div class="cap-rotulo">Capítulo ${c.num} · ${c.materia === 'historia' ? 'História' : 'Geografia'}</div>
      <div class="cap-nome">${c.nome}</div>
      <div class="cap-desc">${c.desc}</div>
      <div class="cap-stats">
        🎮 ${jogos.length} jogos
        ${acertos > 0 ? `<span>⭐ ${acertos}/${totalPerg}</span>` : ''}
      </div>
      <div class="cap-progresso-bar"><div class="cap-progresso-fill" style="width:${pct}%"></div></div>
    </div>
  `;
}

function abrirCapitulo(k) {
  CAP_ATUAL = k;
  const c = CAPS[k];
  document.getElementById('tela-capitulos').style.display = 'none';
  document.getElementById('tela-jogos-cap').style.display = 'block';
  document.getElementById('tela-jogo').style.display = 'none';
  document.getElementById('breadcrumb-cap').textContent = `Cap ${c.num} · ${c.materia === 'historia' ? 'História' : 'Geografia'}`;
  document.getElementById('cap-titulo').innerHTML = `${c.nome}<span class="cap-sub">${c.desc}</span>`;
  const jogos = c.jogos.map(id => JOGOS.find(j => j.id === id)).filter(Boolean);
  const cont = document.getElementById('grid-container');
  cont.innerHTML = jogos.map(j => {
    const p = STATE.jogos[j.id] || { acertos: 0, erros: 0 };
    return `
      <div class="jogo-card" onclick="iniciarJogo('${j.id}')">
        <div class="emoji">${j.emoji}</div>
        <div class="titulo">${j.titulo}</div>
        <div class="desc">${j.desc}</div>
        <div class="progresso">${p.acertos > 0 ? `<span class="estrelas">⭐ ${p.acertos}</span>` : '🎯 Bora!'}</div>
      </div>`;
  }).join('');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function voltarCapitulos() {
  CAP_ATUAL = null;
  renderCapitulos();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function iniciarJogo(id) {
  const jogo = JOGOS.find(j => j.id === id);
  if (jogo) abrirJogo(jogo);
}

function atualizarGridProgresso() {
  if (CAP_ATUAL) abrirCapitulo(CAP_ATUAL);
  else renderCapitulos();
}

const _origVoltarGrid = voltarGrid;
voltarGrid = function() {
  document.getElementById('tela-jogo').style.display = 'none';
  if (CAP_ATUAL) {
    document.getElementById('tela-jogos-cap').style.display = 'block';
    abrirCapitulo(CAP_ATUAL);
  } else {
    document.getElementById('tela-capitulos').style.display = 'block';
    renderCapitulos();
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

document.querySelectorAll('.aba').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.aba').forEach(x => x.classList.remove('ativa'));
    b.classList.add('ativa');
    ABA_ATUAL = b.dataset.aba;
    renderCapitulos();
  });
});

renderCapitulos();
</script>
