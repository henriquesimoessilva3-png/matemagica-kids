<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EXPLORA · 2º Ano</title>
<link rel="stylesheet" href="historia_shared.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d4a574">
<style>
  .topo-ano { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
  .topo-ano h1 { font-size: 22px; margin: 0; flex: 1; text-align: center; }
  .abas { display: flex; gap: 6px; justify-content: center; margin: 8px 0 14px; flex-wrap: wrap; }
  .aba {
    background: #fff4dc; border: 2px solid #c9a86b;
    color: #6b3a15; padding: 8px 14px; border-radius: 18px;
    font-size: 13px; font-weight: 700; cursor: pointer;
    font-family: inherit;
  }
  .aba.ativa { background: linear-gradient(135deg, #8b5a2b, #b88247); color: #fff; border-color: #6b3a15; }
  .aba:hover:not(.ativa) { border-color: #8b5a2b; }
</style>
</head>
<body>
<div class="container">
  <div class="topo-ano">
    <a href="index.html" class="btn-voltar">← Anos</a>
    <h1>2º Ano · Comunidade e Tempo</h1>
    <span style="width:60px"></span>
  </div>

  <div id="explora-header" class="header-player"></div>

  <div class="abas">
    <button class="aba ativa" data-aba="todos">🎯 Todos</button>
    <button class="aba" data-aba="historia">📜 História</button>
    <button class="aba" data-aba="geografia">🗺️ Geografia</button>
  </div>

  <div id="tela-grid"><div class="jogos-grid" id="grid-container"></div></div>
  <div id="tela-jogo" class="jogo-area" style="display:none"></div>
</div>

<script src="mascotes.js"></script>
<script src="explora_shared.js?v=5"></script>
<script>
initExplora({ storageKey: 'explora_ano2_v1' });
let ABA_ATUAL = 'todos';

const JOGOS = [
  {
    id: 'antigo_novo', emoji: '📻', titulo: 'Antigo ou Novo?',
    desc: 'Objetos do passado e do presente.',
    tipo: 'classif', materia: 'historia',
    perguntas: [
      {
        pergunta: 'Classifique cada objeto:',
        bucketA: { label: 'Mais antigo', emoji: '📻' },
        bucketB: { label: 'Mais novo', emoji: '📱' },
        itens: [
          { id: 'i1', label: 'Pena e tinteiro para escrever' },
          { id: 'i2', label: 'Celular' },
          { id: 'i3', label: 'Computador' },
          { id: 'i4', label: 'Máquina de escrever' },
          { id: 'i5', label: 'Carruagem puxada por cavalo' },
          { id: 'i6', label: 'Carro elétrico' }
        ],
        gabarito: { i1: 'a', i2: 'b', i3: 'b', i4: 'a', i5: 'a', i6: 'b' },
        explica: 'Os objetos mudam com o tempo — a tecnologia avança e coisas novas substituem as antigas.'
      },
      {
        pergunta: 'Sobre comunicação:',
        bucketA: { label: 'Antigo', emoji: '✉️' },
        bucketB: { label: 'Atual', emoji: '📲' },
        itens: [
          { id: 'i1', label: 'Carta escrita à mão e mandada pelo correio' },
          { id: 'i2', label: 'Mensagem pelo aplicativo' },
          { id: 'i3', label: 'Telegrama' },
          { id: 'i4', label: 'Ligação por vídeo' }
        ],
        gabarito: { i1: 'a', i2: 'b', i3: 'a', i4: 'b' },
        explica: 'Hoje a gente se comunica muito mais rápido. Antes, levava dias ou semanas.'
      }
    ]
  },
  {
    id: 'campo_cidade', emoji: '🏙️', titulo: 'Campo ou Cidade?',
    desc: 'Trabalhos e paisagens diferentes.',
    tipo: 'classif', materia: 'geografia',
    perguntas: [
      {
        pergunta: 'Onde cada coisa é mais comum?',
        bucketA: { label: 'Campo (zona rural)', emoji: '🌾' },
        bucketB: { label: 'Cidade (zona urbana)', emoji: '🏙️' },
        itens: [
          { id: 'i1', label: 'Plantação de soja e milho' },
          { id: 'i2', label: 'Prédios com muitos andares' },
          { id: 'i3', label: 'Gado pastando' },
          { id: 'i4', label: 'Semáforos e avenidas' },
          { id: 'i5', label: 'Escola com quadra' },
          { id: 'i6', label: 'Trator arando a terra' }
        ],
        gabarito: { i1: 'a', i2: 'b', i3: 'a', i4: 'b', i5: 'b', i6: 'a' },
        explica: 'Campo = agricultura e animais. Cidade = casas, prédios, comércio.'
      }
    ]
  },
  {
    id: 'rotina', emoji: '⏰', titulo: 'Hora de Quê?',
    desc: 'A rotina do dia.',
    tipo: 'quiz', materia: 'historia',
    perguntas: [
      { pergunta: 'O que a gente faz por volta das 12h (meio-dia)?',
        opcoes: ['Almoçar', 'Dormir a noite toda', 'Tomar banho antes de dormir', 'Assistir a novela da noite'],
        correta: 0,
        explica: 'Meio-dia = hora do almoço, quando o Sol está mais alto no céu.' },
      { pergunta: 'Geralmente, a que horas uma criança vai para a escola de manhã?',
        opcoes: ['Entre 7h e 8h', 'À meia-noite', 'Depois do jantar', 'Às 23h'],
        correta: 0,
        explica: 'Aula de manhã costuma começar cedo, por volta das 7h ou 8h.' },
      { pergunta: 'A palavra "ontem" se refere a:',
        opcoes: ['Dia que já passou', 'Dia que ainda vai chegar', 'Hoje', 'Daqui a um ano'],
        correta: 0,
        explica: 'Ontem = passado próximo. Amanhã = futuro próximo. Hoje = agora.' },
      { pergunta: 'Um ano tem quantos meses?',
        opcoes: ['12', '7', '30', '365'],
        correta: 0,
        explica: 'Janeiro, fevereiro, março… até dezembro. São 12 meses no ano.' }
    ]
  },
  {
    id: 'minha_linha', emoji: '👣', titulo: 'Minha Linha do Tempo',
    desc: 'Ordenar momentos da própria vida.',
    tipo: 'ordenar', materia: 'historia',
    perguntas: [
      {
        pergunta: 'Ordene os momentos da vida de uma criança:',
        itens: [
          { id: 'a', label: 'Nascer', emoji: '👶' },
          { id: 'b', label: 'Aprender a andar', emoji: '🚶' },
          { id: 'c', label: 'Começar a falar', emoji: '🗣️' },
          { id: 'd', label: 'Entrar na escola', emoji: '🎒' },
          { id: 'e', label: 'Estar hoje no 2º ano', emoji: '📚' }
        ],
        explica: 'Cada pessoa tem a própria linha do tempo. Os momentos vão se somando.'
      },
      {
        pergunta: 'Ordene as estações do ano no Brasil (começando pela primavera):',
        itens: [
          { id: 'a', label: 'Primavera', emoji: '🌸' },
          { id: 'b', label: 'Verão', emoji: '☀️' },
          { id: 'c', label: 'Outono', emoji: '🍂' },
          { id: 'd', label: 'Inverno', emoji: '❄️' }
        ],
        explica: 'A ordem das estações é sempre a mesma: primavera, verão, outono, inverno.'
      }
    ]
  }
];

function renderGrid() {
  const cont = document.getElementById('grid-container');
  const jogos = JOGOS.filter(j => ABA_ATUAL === 'todos' || j.materia === ABA_ATUAL);
  if (jogos.length === 0) {
    cont.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#8b5a2b;padding:24px">Nenhum jogo nessa matéria ainda.</div>';
    return;
  }
  cont.innerHTML = jogos.map(j => {
    const p = STATE.jogos[j.id] || { acertos: 0, erros: 0 };
    return `
    <div class="jogo-card" onclick="iniciarJogo('${j.id}')">
      <div class="emoji">${j.emoji}</div>
      <div class="titulo">${j.titulo}</div>
      <div class="desc">${j.desc}</div>
      <div class="progresso">${p.acertos > 0 ? `<span class="estrelas">⭐ ${p.acertos}</span>` : '🎯 Bora!'}</div>
    </div>`;
  }).join('');
}

function iniciarJogo(id) {
  const jogo = JOGOS.find(j => j.id === id);
  if (jogo) abrirJogo(jogo);
}

function atualizarGridProgresso() { renderGrid(); }

document.querySelectorAll('.aba').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.aba').forEach(x => x.classList.remove('ativa'));
    b.classList.add('ativa');
    ABA_ATUAL = b.dataset.aba;
    renderGrid();
  });
});

renderGrid();
</script>
</body>
</html>
