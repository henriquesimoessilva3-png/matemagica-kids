<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EXPLORA · 3º Ano</title>
<link rel="stylesheet" href="historia_shared.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6fa84a">
<style>
  .topo-ano { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
  .topo-ano h1 { font-size: 22px; margin: 0; flex: 1; text-align: center; }
  .abas { display: flex; gap: 6px; justify-content: center; margin: 8px 0 14px; flex-wrap: wrap; }
  .aba {
    background: #fff4dc; border: 2px solid #c9a86b;
    color: #6b3a15; padding: 8px 14px; border-radius: 18px;
    font-size: 13px; font-weight: 700; cursor: pointer;
    font-family: inherit;
  }
  .aba.ativa { background: linear-gradient(135deg, #8b5a2b, #b88247); color: #fff; border-color: #6b3a15; }
  .aba:hover:not(.ativa) { border-color: #8b5a2b; }
</style>
</head>
<body>
<div class="container">
  <div class="topo-ano">
    <a href="index.html" class="btn-voltar">← Anos</a>
    <h1>3º Ano · Cidade e Município</h1>
    <span style="width:60px"></span>
  </div>

  <div id="explora-header" class="header-player"></div>

  <div class="abas">
    <button class="aba ativa" data-aba="todos">🎯 Todos</button>
    <button class="aba" data-aba="historia">📜 História</button>
    <button class="aba" data-aba="geografia">🗺️ Geografia</button>
  </div>

  <div id="tela-grid"><div class="jogos-grid" id="grid-container"></div></div>
  <div id="tela-jogo" class="jogo-area" style="display:none"></div>
</div>

<script src="mascotes.js"></script>
<script src="explora_shared.js?v=5"></script>
<script>

let ABA_ATUAL = 'todos';

const JOGOS = [

      {
        pergunta: 'De onde vem cada produto?',
        bucketA: { label: 'Do campo', emoji: '🌾' },
        bucketB: { label: 'Da fábrica (cidade)', emoji: '🏭' },
        itens: [
          { id: 'i1', label: 'Leite recém-ordenhado' },

          { id: 'i3', label: 'Feijão colhido' },
          { id: 'i4', label: 'Feijão enlatado' },
          { id: 'i5', label: 'Cana-de-açúcar' },
          { id: 'i6', label: 'Açúcar em pacotinho' }
        ],
        gabarito: { i1: 'a', i2: 'b', i3: 'a', i4: 'b', i5: 'a', i6: 'b' },
        explica: 'O campo produz a matéria-prima. A fábrica processa e embala — depois chega ao mercado.'
      }
    ]
  },
  {
    id: 'povos_brasil', emoji: '🤝', titulo: 'Povos do Brasil',
    desc: 'Quem faz parte do Brasil que conhecemos.',
    tipo: 'quiz', materia: 'historia',
    perguntas: [
      { pergunta: 'Quem já vivia no território brasileiro antes dos portugueses chegarem em 1500?',
        opcoes: ['Povos indígenas (vários grupos, como Tupinambá, Guarani, Xavante…)',
                 'Europeus', 'Ninguém vivia aqui', 'Só animais'],

        explica: 'Os povos indígenas já viviam no que hoje é o Brasil há mais de 10 mil anos, com culturas muito diversas.' },

          'Quando se compra uma casa nova'

    perguntas: [

    ]

  {
    id: 'municipio', emoji: '🏛️', titulo: 'Meu Município',

    perguntas: [
      { pergunta: 'O que é um município?',

    ]

];

function renderGrid() {
  const cont = document.getElementById('grid-container');
  const jogos = JOGOS.filter(j => ABA_ATUAL === 'todos' || j.materia === ABA_ATUAL);
  if (jogos.length === 0) {
    cont.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#8b5a2b;padding:24px">Nenhum jogo nessa matéria ainda.</div>';
    return;
  }
  cont.innerHTML = jogos.map(j => {
    const p = STATE.jogos[j.id] || { acertos: 0, erros: 0 };
    return `
    <div class="jogo-card" onclick="iniciarJogo('${j.id}')">
      <div class="emoji">${j.emoji}</div>
      <div class="titulo">${j.titulo}</div>
      <div class="desc">${j.desc}</div>
      <div class="progresso">${p.acertos > 0 ? `<span class="estrelas">⭐ ${p.acertos}</span>` : '🎯 Bora!'}</div>
    </div>`;
  }).join('');
}

function iniciarJogo(id) {
  const jogo = JOGOS.find(j => j.id === id);
  if (jogo) abrirJogo(jogo);
}

function atualizarGridProgresso() { renderGrid(); }

document.querySelectorAll('.aba').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.aba').forEach(x => x.classList.remove('ativa'));
    b.classList.add('ativa');
    ABA_ATUAL = b.dataset.aba;
    renderGrid();
  });
});

renderGrid();
</script>
</body>
</html>
