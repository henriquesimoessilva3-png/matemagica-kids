<script>
STORAGE_KEY = 'jogosMat1ano_v1';

CAPS = {
  1: { nome: 'Capítulo 1 — Os números até 20', jogos: [
    { id: 'conta', nome: 'Conte os bichinhos', desc: 'Quantos são? Até 20!' },
    { id: 'maior', nome: 'Qual é o maior?', desc: 'Compare dois números' },
    { id: 'qualFalta', nome: 'Qual número falta?', desc: 'Complete a sequência' },
    { id: 'parImpar', nome: 'Par ou Ímpar?', desc: 'O número é par ou ímpar?' }
  ]},
  2: { nome: 'Capítulo 2 — Formas planas', jogos: [
    { id: 'queForma', nome: 'Que forma é essa?', desc: 'Círculo, quadrado, retângulo, triângulo' },
    { id: 'contaForma', nome: 'Quantos de cada forma?', desc: 'Conte os triângulos, quadrados...' },
    { id: 'objForma', nome: 'Forma do objeto', desc: 'A bola é um... círculo!' }
  ]},
  3: { nome: 'Capítulo 3 — Meu dia, meu mês', jogos: [
    { id: 'diaAmanha', nome: 'Dia da semana', desc: 'Hoje é X. Amanhã é?' },
    { id: 'proxMes', nome: 'Qual o próximo mês?', desc: 'Depois de Janeiro vem...' },
    { id: 'diaAntes', nome: 'Que dia vem antes?', desc: 'Antes de quarta vem...' }
  ]},
  4: { nome: 'Capítulo 4 — Dinheirinho', jogos: [
    { id: 'moeda', nome: 'Qual o valor da moeda?', desc: 'Moedas do real' },
    { id: 'cofrinho', nome: 'Quanto tem no cofrinho?', desc: 'Some as moedas' },
    { id: 'posso', nome: 'Posso comprar?', desc: 'Tenho dinheiro suficiente?' }
  ]},
  5: { nome: 'Capítulo 5 — Tabelas e gráficos', jogos: [
    { id: 'quemMais', nome: 'Quem tem mais?', desc: 'Leia o gráfico e escolha' },
    { id: 'totalBichos', nome: 'Quantos ao todo?', desc: 'Some os valores da tabela' },
    { id: 'menor', nome: 'Quem tem menos?', desc: 'Encontre o menor do gráfico' }
  ]}
};

TUTORIAIS = {
  conta: { emoji:'🧮', titulo:'Conte os bichinhos', corpo:`
    <p>Aparecem vários bichinhos ou objetos. Conta um por um e escolhe o número certo.</p>
    <div class="exemplo">🐱🐱🐱🐱🐱 → são <b>5</b> gatinhos</div>`},
  maior: { emoji:'🔼', titulo:'Qual é o maior?', corpo:`
    <p>Dois números aparecem. Escolhe o maior (ou o menor, se pedido).</p>
    <div class="exemplo">Entre <b>7</b> e <b>4</b> → o maior é <b>7</b></div>`},
  qualFalta: { emoji:'🔍', titulo:'Qual número falta?', corpo:`
    <p>Na fila de números, um está faltando. Qual é?</p>
    <div class="exemplo">3, 4, <b>?</b>, 6 → falta o <b>5</b></div>`},
  queForma: { emoji:'🔺', titulo:'Que forma é essa?', corpo:`
    <p>Olha a figura e escolhe o nome certo.</p>
    <div class="exemplo">⚪ = círculo · 🟥 = quadrado · 🔺 = triângulo</div>`},
  contaForma: { emoji:'🧮', titulo:'Quantos de cada forma?', corpo:`
    <p>Várias formas misturadas. Conta quantas são da forma pedida.</p>
    <div class="exemplo">🔺🔺⚪🔺 → <b>3</b> triângulos</div>`},
  objForma: { emoji:'⚽', titulo:'Forma do objeto', corpo:`
    <p>Que forma o objeto se parece?</p>
    <div class="exemplo">Bola ⚽ = círculo · Janela 🟥 = quadrado</div>`},
  diaAmanha: { emoji:'📅', titulo:'Dia da semana', corpo:`
    <p>Hoje é um dia. Que dia vem amanhã?</p>
    <div class="exemplo">Hoje segunda → amanhã <b>terça</b></div>`},
  proxMes: { emoji:'🗓️', titulo:'Qual o próximo mês?', corpo:`
    <p>Depois de um mês vem o próximo. Qual é?</p>
    <div class="exemplo">Depois de março vem <b>abril</b></div>`},
  diaAntes: { emoji:'⏮️', titulo:'Que dia vem antes?', corpo:`
    <p>Qual dia da semana vem antes de outro?</p>
    <div class="exemplo">Antes de quarta → <b>terça</b></div>`},
  moeda: { emoji:'🪙', titulo:'Qual o valor da moeda?', corpo:`
    <p>Olha a moeda e escolhe o valor.</p>
    <div class="exemplo">Moedas: R$ 1 · 50¢ · 25¢ · 10¢ · 5¢</div>`},
  cofrinho: { emoji:'🐷', titulo:'Quanto tem no cofrinho?', corpo:`
    <p>Soma o valor de todas as moedas do cofrinho.</p>
    <div class="exemplo">R$1 + R$1 = <b>R$ 2</b></div>`},
  posso: { emoji:'🛒', titulo:'Posso comprar?', corpo:`
    <p>Tenho um dinheiro e quero um item. Dá pra comprar?</p>
    <div class="exemplo">Tenho R$ 5. Item custa R$ 3. <b>Sim!</b></div>`},
  quemMais: { emoji:'📊', titulo:'Quem tem mais?', corpo:`
    <p>Olha o gráfico. Qual coluna é mais alta?</p>
    <div class="exemplo">Quanto mais alta, mais tem.</div>`},
  totalBichos: { emoji:'➕', titulo:'Quantos ao todo?', corpo:`
    <p>Soma os valores de todas as categorias do gráfico.</p>
    <div class="exemplo">Cachorros=3 + Gatos=2 → <b>5</b> bichinhos</div>`},
  menor: { emoji:'🔽', titulo:'Quem tem menos?', corpo:`
    <p>No gráfico, qual coluna é mais baixa?</p>
    <div class="exemplo">Menos alta = menos quantidade.</div>`},
  parImpar: { emoji:'2️⃣', titulo:'Par ou Ímpar?', corpo:`
    <p>Par = dá pra dividir em 2 grupos iguais (2, 4, 6, 8, 10...). Ímpar = sobra 1 (1, 3, 5, 7, 9...).</p>
    <div class="exemplo">Termina em 0, 2, 4, 6 ou 8 = PAR. Termina em 1, 3, 5, 7 ou 9 = ÍMPAR.</div>`}
};

DICAS = {
  conta: (n) => `Conta um por um, com o dedinho. A resposta era ${n}.`,
  maior: (a, b) => `${a} e ${b}. O maior é o que vem depois na contagem: ${Math.max(a,b)}.`,
  qualFalta: (n) => `Conta a fila na ordem. Faltava o número ${n}.`,
  queForma: (nome) => `Era um ${nome}. Aprende olhando as laterais (cantos ou redondo).`,
  contaForma: (n, tipo) => `Tinha ${n} ${tipo}(s). Conta só os dessa forma, ignora o resto.`,
  objForma: (obj, f) => `${obj} tem forma de ${f}.`,
  diaAmanha: (hoje, amanha) => `Depois de ${hoje} vem ${amanha}.`,
  proxMes: (mes, prox) => `Depois de ${mes} vem ${prox}.`,
  diaAntes: (dia, antes) => `Antes de ${dia} vem ${antes}.`,
  moeda: (v) => `Essa moeda vale ${v}.`,
  cofrinho: (t) => `Soma todas as moedas → total R$ ${t.toFixed(2).replace('.',',')}.`,
  posso: () => `Compara: o dinheiro que tem precisa ser maior ou igual ao preço.`,
  quemMais: (q) => `A maior coluna é do ${q}.`,
  totalBichos: (t) => `Soma cada categoria → total ${t}.`,
  menor: (q) => `A menor coluna é do ${q}.`,
  parImpar: (n, r) => `${n} é ${r}. Olha o último algarismo: par se for 0,2,4,6,8; ímpar se for 1,3,5,7,9.`
};

// ============== JOGOS ==============

const BICHINHOS = ['🐱','🐶','🐰','🐻','🦊','🐼','🐨','🦁','🐸','🦄','🐙','🦋'];
const OBJETOS = ['⭐','❤️','🌸','🍎','🎈','🌈','🎁','🌙','☀️','🌟'];

JOGOS.conta = {
  iniciar() {
    const fx = pickNivel([[2,6],[2,12],[5,20]], 'conta');
    const maxN = fx[1];
    const n = rand(fx[1], fx[0]);
    const emoji = escolher([...BICHINHOS, ...OBJETOS]);
    jogoState.resposta = n;
    let grid = '';
    for (let i = 0; i < n; i++) grid += `<div class="obj">${emoji}</div>`;
    const opcoes = new Set([n]);
    while (opcoes.size < 4) opcoes.add(rand(Math.min(maxN, n + 3), Math.max(1, n - 3)));
    const arr = [...opcoes].sort(() => Math.random() - 0.5);
    document.getElementById('jogo-conteudo').innerHTML = `
      <div class="pergunta" style="font-size:20px">Quantos ${emoji} têm aqui?</div>
      <div class="obj-grid">${grid}</div>
      <div class="opcoes q4">${arr.map(o => `<button onclick="JOGOS.conta.conferir(${o})">${o}</button>`).join('')}</div>
      <div class="feedback" id="feedback"></div>`;
  },
  conferir(escolha) {
    if (escolha === jogoState.resposta) feedbackAcerto(`Acertou! ${escolha} no total`);
    else feedbackErro(`Eram ${jogoState.resposta}`, DICAS.conta(jogoState.resposta));
  }
};

JOGOS.maior = {
  iniciar() {
    const fx = pickNivel([[1,10],[1,20],[1,50]], 'maior');
    let a = rand(fx[1], fx[0]), b = rand(fx[1], fx[0]);
    while (a === b) b = rand(fx[1], fx[0]);
    const procuraMaior = rand(1, 0) === 1;
    jogoState.a = a; jogoState.b = b; jogoState.procuraMaior = procuraMaior;
    jogoState.resposta = procuraMaior ? Math.max(a, b) : Math.min(a, b);
    document.getElementById('jogo-conteudo').innerHTML = `
      <div class="pergunta">Qual é o ${procuraMaior ? '<b style="color:#4ab3a5">MAIOR</b>' : '<b style="color:#ff7b6b">MENOR</b>'}?</div>
      <div class="opcoes">
        <button onclick="JOGOS.maior.conferir(${a})" style="font-size:32px">${a}</button>
        <button onclick="JOGOS.maior.conferir(${b})" style="font-size:32px">${b}</button>
      </div>
      <div class="feedback" id="feedback"></div>`;
  },
  conferir(escolha) {
    if (escolha === jogoState.resposta) feedbackAcerto(`Isso! ${escolha} é o ${jogoState.procuraMaior ? 'maior' : 'menor'}`);
    else feedbackErro(`Era ${jogoState.resposta}`, DICAS.maior(jogoState.a, jogoState.b));
  }
};

JOGOS.qualFalta = {
  iniciar() {
    const fx = pickNivel([[1,10],[1,25],[1,50]], 'qualFalta');
    const inicio = rand(fx[1], fx[0]);
    const seq = [];
    for (let i = 0; i < 5; i++) seq.push(inicio + i);
    const posFalta = rand(3, 1);
    jogoState.resposta = seq[posFalta];
    const html = seq.map((n, i) =>
      i === posFalta ? `<div class="num-box falta">?</div>` : `<div class="num-box">${n}</div>`
    ).join('');
    const opcoes = new Set([jogoState.resposta]);
    while (opcoes.size < 4) opcoes.add(rand(jogoState.resposta + 3, Math.max(1, jogoState.resposta - 3)));
    const arr = [...opcoes].sort(() => Math.random() - 0.5);
    document.getElementById('jogo-conteudo').innerHTML = `
      <div class="pergunta">Qual número está faltando?</div>
      <div class="seq-vis">${html}</div>
      <div class="opcoes q4">${arr.map(o => `<button onclick="JOGOS.qualFalta.conferir(${o})" style="font-size:26px">${o}</button>`).join('')}</div>
      <div class="feedback" id="feedback"></div>`;
  },
  conferir(escolha) {
    if (escolha === jogoState.resposta) feedbackAcerto('Acertou!');
    else feedbackErro(`Era ${jogoState.resposta}`, DICAS.qualFalta(jogoState.resposta));
  }
};

const FORMAS_PLANAS = [
  {nome:'círculo', svg:'<circle cx="80" cy="70" r="55" fill="#ff7b6b" stroke="#4a3b8a" stroke-width="3"/>'},
  {nome:'quadrado', svg:'<rect x="25" y="15" width="110" height="110" fill="#4ab3a5" stroke="#4a3b8a" stroke-width="3"/>'},
  {nome:'retângulo', svg:'<rect x="15" y="30" width="130" height="80" fill="#5ba8e8" stroke="#4a3b8a" stroke-width="3"/>'},
  {nome:'triângulo', svg:'<polygon points="80,15 20,120 140,120" fill="#ffd36b" stroke="#4a3b8a" stroke-width="3"/>'}
];

JOGOS.queForma = {
  iniciar() {
    const f = escolher(FORMAS_PLANAS);
    jogoState.resposta = f.nome;
    const opcoes = [...FORMAS_PLANAS].sort(() => Math.random() - 0.5);
    document.getElementById('jogo-conteudo').innerHTML = `
      <div class="pergunta">Que forma é essa?</div>
      <svg width="160" height="140" viewBox="0 0 160 140">${f.svg}</svg>
      <div class="opcoes q4" style="margin-top:14px">
        ${opcoes.map(o => `<button onclick="JOGOS.queForma.conferir('${o.nome}')">${o.nome}</button>`).join('')}
      </div>
      <div class="feedback" id="feedback"></div>`;
  },
  conferir(escolha) {
    if (escolha === jogoState.resposta) feedbackAcerto(`Isso! É um ${escolha}`);
    else feedbackErro(`Era um ${jogoState.resposta}`, DICAS.queForma(jogoState.resposta));
  }
};

JOGOS.contaForma = {
  iniciar() {
    const tipoAlvo = escolher(FORMAS_PLANAS);
    jogoState.tipo = tipoAlvo.nome;
    const fa = pickNivel([[2,4],[2,6],[3,8]], 'contaForma');
    const fo = pickNivel([[1,3],[2,5],[3,7]], 'contaForma');
    const qtdAlvo = rand(fa[1], fa[0]);
    const qtdOutros = rand(fo[1], fo[0]);
    const outros = FORMAS_PLANAS.filter(f => f.nome !== tipoAlvo.nome);
    jogoState.resposta = qtdAlvo;
    let figs = [];
    for (let i = 0; i < qtdAlvo; i++) figs.push(tipoAlvo);
    for (let i = 0; i < qtdOutros; i++) figs.push(escolher(outros));
    figs.sort(() => Math.random() - 0.5);
    const html = figs.map(f =>
      `<div style="display:inline-block;margin:6px"><svg width="54" height="54" viewBox="0 0 160 140" style="transform:scale(0.35);transform-origin:top left;width:54px;height:54px">${f.svg}</svg></div>`
    ).join('');
    const opcoes = new Set([qtdAlvo]);
    while (opcoes.size < 4) opcoes.add(rand(qtdAlvo + 2, Math.max(1, qtdAlvo - 2)));
    const arr = [...opcoes].sort(() => Math.random() - 0.5);
    document.getElementById('jogo-conteudo').innerHTML = `
      <div class="pergunta">Quantos <b>${tipoAlvo.nome}s</b> tem?</div>
      <div style="text-align:center;background:#f7f5ff;border-radius:14px;padding:14px;margin:10px 0">${html}</div>
      <div class="opcoes q4">${arr.map(o => `<button onclick="JOGOS.contaForma.conferir(${o})" style="font-size:24px">${o}</button>`).join('')}</div>
      <div class="feedback" id="feedback"></div>`;
  },
  conferir(escolha) {
    if (escolha === jogoState.resposta) feedbackAcerto(`Acertou! ${escolha} ${jogoState.tipo}s`);
    else feedbackErro(`Eram ${jogoState.resposta}`, DICAS.contaForma(jogoState.resposta, jogoState.tipo));
  }
};

const OBJ_FORMA = [
  {obj:'⚽ bola', forma:'círculo'},
  {obj:'🪟 janela', forma:'quadrado'},
  {obj:'📺 TV', forma:'retângulo'},
  {obj:'🍕 fatia de pizza', forma:'triângulo'},
  {obj:'🕐 relógio de parede', forma:'círculo'},
  {obj:'📱 celular', forma:'retângulo'},
  {obj:'🎲 dado', forma:'quadrado'},
  {obj:'🍩 rosquinha', forma:'círculo'},
  {obj:'📕 livro', forma:'retângulo'},
  {obj:'🚸 placa de escola', forma:'triângulo'}
];

JOGOS.objForma = {
  iniciar() {
    const o = escolher(OBJ_FORMA);
    jogoState.obj = o.obj; jogoState.resposta = o.forma;
    document.getElementById('jogo-conteudo').innerHTML = `
      <div class="pergunta">Qual forma tem um<br><b style="font-size:34px">${o.obj}</b>?</div>
      <div class="opcoes q4">${FORMAS_PLANAS.map(f => `<button onclick="JOGOS.objForma.conferir('${f.nome}')">${f.nome}</button>`).join('')}</div>
      <div class="feedback" id="feedback"></div>`;
  },
  conferir(escolha) {
    if (escolha === jogoState.resposta) feedbackAcerto(`Isso! ${jogoState.obj.split(' ').slice(1).join(' ')} é ${escolha}`);
    else feedbackErro(`Era ${jogoState.resposta}`, DICAS.objForma(jogoState.obj.split(' ').slice(1).join(' '), jogoState.resposta));
  }
};

const DIAS = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];

JOGOS.diaAmanha = {
  iniciar() {
    const idx = rand(6, 0);
    jogoState.hoje = DIAS[idx];
    jogoState.resposta = DIAS[(idx + 1) % 7];
    const opcoes = [...DIAS].sort(() => Math.random() - 0.5).slice(0, 4);
    if (!opcoes.includes(jogoState.resposta)) opcoes[0] = jogoState.resposta;
    opcoes.sort(() => Math.random() - 0.5);
    document.getElementById('jogo-conteudo').innerHTML = `
      <div class="pergunta">Hoje é <b style="color:#ff9a44">${jogoState.hoje}</b>.<br>Que dia é amanhã?</div>
      <div class="opcoes q4">${opcoes.map(d => `<button onclick="JOGOS.diaAmanha.conferir('${d}')">${d}</button>`).join('')}</div>
      <div class="feedback" id="feedback"></div>`;
  },
  conferir(escolha) {
    if (escolha === jogoState.resposta) feedbackAcerto(`Isso! Amanhã é ${escolha}`);
    else feedbackErro(`Era ${jogoState.resposta}`, DICAS.diaAmanha(jogoState.hoje, jogoState.resposta));
  }
};

JOGOS.diaAntes = {
  iniciar() {
    const idx = rand(6, 0);
    jogoState.hoje = DIAS[idx];
    jogoState.resposta = DIAS[(idx + 6) % 7];

// Moedas e notas do Real
const MOEDAS = [
  {val:1.00, label:'R$ 1'},
  {val:0.50, label:'50 centavos'},
  {val:0.25, label:'25 centavos'},
  {val:0.10, label:'10 centavos'},
  {val:0.05, label:'5 centavos'}
];
const NOTAS = [2, 5, 10, 20, 50, 100];

function formatReal(v) {
  if (v < 1) return (v * 100).toFixed(0) + '¢';
  return 'R$ ' + v.toFixed(2).replace('.',',').replace(',00','');
}

function renderMoeda(m) {
  if (m.val < 1) return `<div class="moeda"><span class="val">${(m.val*100).toFixed(0)}</span><span class="cent">cent</span></div>`;
  return `<div class="moeda"><span class="val">R$${m.val.toFixed(0)}</span></div>`;
}

JOGOS.moeda = {
  iniciar() {
    const m = escolher(MOEDAS);
    jogoState.resposta = m.label;
    const opcoes = [...MOEDAS].sort(() => Math.random() - 0.5).slice(0, 4);
    if (!opcoes.find(o => o.label === m.label)) opcoes[0] = m;
    opcoes.sort(() => Math.random() - 0.5);
    document.getElementById('jogo-conteudo').innerHTML = `
      <div class="pergunta">Qual o valor desta moeda?</div>
      <div class="moedas-grid" style="justify-content:center">${renderMoeda(m)}</div>
      <div class="opcoes q4">${opcoes.map(o => `<button onclick="JOGOS.moeda.conferir('${o.label}')">${o.label}</button>`).join('')}</div>
      <div class="feedback" id="feedback"></div>`;
  },
  conferir(escolha) {
    if (escolha === jogoState.resposta) feedbackAcerto(`Acertou! ${escolha}`);
    else feedbackErro(`Era ${jogoState.resposta}`, DICAS.moeda(jogoState.resposta));
  }
};

JOGOS.cofrinho = {
  iniciar() {

    const moedasReais = [{val:1, label:'R$ 1'}, {val:2, label:'R$ 2'}];
    let total = 0;
    let html = '';
    for (let i = 0; i < qtd; i++) {
      const m = escolher(moedasReais);

        ? `<div class="moeda"><span class="val">R$1</span></div>`

      <div class="pergunta">Quanto dinheiro tem no cofrinho?</div>
      <div class="moedas-grid">${html}</div>

      <div class="feedback" id="feedback"></div>`;
  },
  conferir(escolha) {
    if (escolha === jogoState.resposta) feedbackAcerto(`Acertou! R$ ${escolha}`);
    else feedbackErro(`Eram R$ ${jogoState.resposta}`, DICAS.cofrinho(jogoState.resposta));
  }
};

JOGOS.posso = {
  itens: [
    {nome:'sorvete',emoji:'🍦'}, {nome:'pipoca',emoji:'🍿'},
    {nome:'bala',emoji:'🍬'}, {nome:'maçã',emoji:'🍎'},

      </div>
      <div class="feedback" id="feedback"></div>`;
  },
  conferir(escolha) {

    else feedbackErro(`${jogoState.resposta ? 'Daria sim, R$' + jogoState.tenho + ' é mais que R$' + jogoState.preco : 'Não daria, R$' + jogoState.tenho + ' é menos que R$' + jogoState.preco}`, DICAS.posso());

// GRÁFICOS DE BARRAS
const ANIMAIS_GRAF = [
  {nome:'cachorros',emoji:'🐶'}, {nome:'gatos',emoji:'🐱'},
  {nome:'coelhos',emoji:'🐰'}, {nome:'peixes',emoji:'🐟'},
  {nome:'pássaros',emoji:'🐦'}
];

function gerarDados(qtd = 3, max = 8) {
  const escolhidos = [...ANIMAIS_GRAF].sort(() => Math.random() - 0.5).slice(0, qtd);
  return escolhidos.map(a => ({...a, qtd: rand(max, 1)}));
}

function renderGrafico(dados) {
  const maxQ = Math.max(...dados.map(d => d.qtd));
  return `<div class="grafico-cols" style="margin-bottom:30px">${dados.map(d =>
    `<div class="col" style="height:${(d.qtd / maxQ) * 160}px">
      <span class="qtd">${d.qtd}</span>
      <span class="nome">${d.emoji} ${d.nome}</span>
    </div>`).join('')}</div>`;
}

JOGOS.quemMais = {
  iniciar() {
    let dados = gerarDados(3, 8);
    // garantir que haja um claro maior
    while (dados.filter(d => d.qtd === Math.max(...dados.map(x => x.qtd))).length > 1) {
      dados = gerarDados(3, 8);
    }
    const maior = dados.reduce((a, b) => a.qtd > b.qtd ? a : b);
    jogoState.resposta = maior.nome;
    document.getElementById('jogo-conteudo').innerHTML = `
      <div class="pergunta">Quem tem <b style="color:#4ab3a5">MAIS</b>?</div>
      ${renderGrafico(dados)}
      <div class="opcoes q3">${dados.map(d => `<button onclick="JOGOS.quemMais.conferir('${d.nome}')">${d.emoji} ${d.nome}</button>`).join('')}</div>
      <div class="feedback" id="feedback"></div>`;
  },
  conferir(escolha) {
    if (escolha === jogoState.resposta) feedbackAcerto(`Isso! ${escolha} tem mais`);
    else feedbackErro(`Era ${jogoState.resposta}`, DICAS.quemMais(jogoState.resposta));
  }
};

JOGOS.menor = {
  iniciar() {
    let dados = gerarDados(3, 8);
    while (dados.filter(d => d.qtd === Math.min(...dados.map(x => x.qtd))).length > 1) {
      dados = gerarDados(3, 8);

    const menor = dados.reduce((a, b) => a.qtd < b.qtd ? a : b);
    jogoState.resposta = menor.nome;

      <div class="pergunta">Quem tem <b style="color:#ff7b6b">MENOS</b>?</div>

  conferir(escolha) {
    if (escolha === jogoState.resposta) feedbackAcerto(`Isso! ${escolha} tem menos`);
    else feedbackErro(`Era ${jogoState.resposta}`, DICAS.menor(jogoState.resposta));
  }
};

JOGOS.totalBichos = {
  iniciar() {

  }
};


JOGOS.parImpar = {
  iniciar() {
    const fx = pickNivel([[1,10],[1,30],[1,99]], 'parImpar');
    const n = rand(fx[1], fx[0]);
    const par = n % 2 === 0;
    jogoState.resposta = par ? 'par' : 'impar'; jogoState.n = n;
    // visual: desenha pares de bolinhas
    let bolas = '';
    for (let i = 0; i < n; i++) {
      bolas += `<span style="display:inline-block;width:20px;height:20px;background:${i%2===0?'#ff7b6b':'#4ab3a5'};border-radius:50%;margin:3px"></span>`;
    }
    document.getElementById('jogo-conteudo').innerHTML = `
      <div class="pergunta">O número <span class="grande">${n}</span> é par ou ímpar?</div>
      <div style="text-align:center;background:#f7f5ff;border-radius:14px;padding:14px;margin:10px 0;line-height:1">${bolas}</div>
      <div class="opcoes">
        <button onclick="JOGOS.parImpar.conferir('par')" style="background:#d4f5dd;border-color:#4ab3a5;color:#1b7a3a">Par</button>

      </div>
      <div class="feedback" id="feedback"></div>`;
  },
  conferir(escolha) {
    if (escolha === jogoState.resposta) feedbackAcerto(`Isso! ${jogoState.n} é ${jogoState.resposta === 'par' ? 'par' : 'ímpar'}`);

};
