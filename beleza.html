}

  return `<svg viewBox="0 0 120 120" width="${size}" height="${size}">
    <circle cx="60" cy="60" r="45" fill="none" stroke="#4ab3a5" stroke-width="3" stroke-dasharray="6,2"/>
    <line x1="15" y1="60" x2="105" y2="60" stroke="#4ab3a5" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="60" y="72" text-anchor="middle" font-size="46" font-weight="800" fill="#6b54d3">π</text>
    <text x="60" y="32" text-anchor="middle" font-size="9" font-weight="700" fill="#666">3,14159…</text>
  </svg>`;
}

// ============== RENDER ==============
function renderCards() {
  const grid = document.getElementById('bz-cards');
  grid.innerHTML = CARDS_BELEZA.map(c => `
    <button class="bz-card" onclick="abrirCard('${c.id}')">
      <div class="bz-viz">${c.vizCard}</div>
      <div class="bz-nome">${c.emoji} ${c.nome}</div>
      <div class="bz-nome-sub">${c.sub}</div>
    </button>
  `).join('');
}

function abrirCard(id) {
  const c = CARDS_BELEZA.find(x => x.id === id);
  if (!c) return;
  const m = document.getElementById('modal-overlay');
  document.getElementById('m-emoji').textContent = c.emoji;
  document.getElementById('m-titulo').textContent = c.nome;
  document.getElementById('m-conteudo').innerHTML = `
    <div class="bz-modal-inner">
      <div class="bz-modal-viz">${c.vizModal}</div>
      <p style="font-size:15px;color:#6b54d3;font-weight:700;text-align:center">${c.intro}</p>
      ${c.corpo}
    </div>
  `;
  document.getElementById('modal-btn').textContent = 'Que legal!';
  document.getElementById('modal-btn').onclick = () => {
    fecharModal();
    try {
      jogoAtivo = 'beleza_' + id;
      STATE.acertou(jogoAtivo);
      renderHeaderPlayer();
    } catch(e) {}
  };
  m.classList.remove('hidden');
  try { somAcerto(); } catch(e) {}
}

initJogos();
renderCards();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
}
</script>
