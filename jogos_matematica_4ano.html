const POR_EXTENSO_MIL = {
  0:'zero',1:'um',2:'dois',3:'três',4:'quatro',5:'cinco',6:'seis',7:'sete',8:'oito',9:'nove',
  10:'dez',11:'onze',12:'doze',13:'treze',14:'quatorze',15:'quinze',16:'dezesseis',17:'dezessete',18:'dezoito',19:'dezenove',
  20:'vinte',30:'trinta',40:'quarenta',50:'cinquenta',60:'sessenta',70:'setenta',80:'oitenta',90:'noventa'
};
function leCent(n) {
  if (n === 0) return '';
  if (POR_EXTENSO_MIL[n]) return POR_EXTENSO_MIL[n];
  if (n < 100) {
    const d = Math.floor(n/10)*10, u = n%10;
    return POR_EXTENSO_MIL[d] + (u>0 ? ' e '+POR_EXTENSO_MIL[u] : '');
  }
  const c = Math.floor(n/100), resto = n%100;
  const cents = ['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
  const partes = [n===100 ? 'cem' : cents[c]];
  if (resto > 0) partes.push('e', leCent(resto));
  return partes.join(' ');
}
function leMil(n) {
  if (n < 1000) return leCent(n);
  const mil = Math.floor(n/1000), resto = n%1000;
  let txt = (mil === 1 ? 'mil' : leCent(mil) + ' mil');
  if (resto > 0) txt += (resto < 100 ? ' e ' : ', ') + leCent(resto);
  return txt;
}

JOGOS.lerMil = {
  iniciar() {
    const n = randNivel([[10, 99], [100, 9999], [10000, 99999]], 'lerMil');
    jogoState.resposta = n;
    const opcoes = new Set([n]);
    // distratores no mesmo bairro de magnitude
    const ordem = Math.pow(10, String(n).length - 1);
    while (opcoes.size < 4) opcoes.add(rand(ordem * 10 - 1, ordem));
    const arr = [...opcoes].sort(() => Math.random() - 0.5);
    document.getElementById('jogo-conteudo').innerHTML = `
      <div class="pergunta">Qual é este número?<br><span style="font-size:16px;color:#6b54d3;display:block;margin-top:6px">${leMil(n)}</span></div>
      <div class="opcoes q4">${arr.map(o => `<button onclick="JOGOS.lerMil.conferir(${o})" style="font-size:22px">${o.toLocaleString('pt-BR')}</button>`).join('')}</div>
      <div class="feedback" id="feedback"></div>`;
  },
  conferir(escolha) {
    if (escolha === jogoState.resposta) feedbackAcerto(`Certo! ${escolha.toLocaleString('pt-BR')}`);
    else feedbackErro(`Era ${jogoState.resposta.toLocaleString('pt-BR')}`, DICAS.lerMil(jogoState.resposta));
  }
};

JOGOS.compMil = {
  iniciar() {
    const faixa = pickNivel([[10, 99], [100, 999], [1000, 99999]], 'compMil');
    let a = rand(faixa[1], faixa[0]), b = rand(faixa[1], faixa[0]);
    while (a === b) b = rand(faixa[1], faixa[0]);
    const procuraMaior = rand(1, 0) === 1;
    jogoState.a = a; jogoState.b = b; jogoState.procuraMaior = procuraMaior;
    jogoState.resposta = procuraMaior ? Math.max(a, b) : Math.min(a, b);
    document.getElementById('jogo-conteudo').innerHTML = `
      <div class="pergunta">Qual é ${procuraMaior ? '<b style="color:#4ab3a5">MAIOR</b>' : '<b style="color:#ff7b6b">MENOR</b>'}?</div>
      <div class="opcoes">
        <button onclick="JOGOS.compMil.conferir(${a})" style="font-size:26px">${a.toLocaleString('pt-BR')}</button>
        <button onclick="JOGOS.compMil.conferir(${b})" style="font-size:26px">${b.toLocaleString('pt-BR')}</button>
      </div>
      <div class="feedback" id="feedback"></div>`;
  },
  conferir(escolha) {
    if (escolha === jogoState.resposta) feedbackAcerto(`Isso! ${escolha.toLocaleString('pt-BR')}`);
    else feedbackErro(`Era ${jogoState.resposta.toLocaleString('pt-BR')}`, DICAS.compMil(jogoState.a, jogoState.b));
  }
};

JOGOS.decMil = {
  iniciar() {
    const n = randNivel([[100, 999], [1000, 9999], [10000, 99999]], 'decMil');
    jogoState.resposta = n;
    const dm = Math.floor(n/10000)*10000;
    const um = Math.floor((n%10000)/1000)*1000;
    const c = Math.floor((n%1000)/100)*100;
    const d = Math.floor((n%100)/10)*10;
    const u = n%10;
    const partes = [dm, um, c, d, u].filter(p => p > 0);
    document.getElementById('jogo-conteudo').innerHTML = `
      <div class="pergunta">Qual número é?<br><span style="font-size:24px;color:#6b54d3">${partes.join(' + ').replace(/\B(?=(\d{3})+(?!\d))/g, '.')}</span></div>
      <input type="number" id="resp" placeholder="?">
      <div class="botoes"><button class="acao" onclick="JOGOS.decMil.conferir()">Conferir</button></div>
      <div class="feedback" id="feedback"></div>`;
    document.getElementById('resp').focus();
    document.getElementById('resp').addEventListener('keydown', e => { if (e.key==='Enter') JOGOS.decMil.conferir(); });
  },
  conferir() {
    const r = parseInt(document.getElementById('resp').value);
    if (isNaN(r)) return feedbackErro('Digite um número!');
    if (r === jogoState.resposta) feedbackAcerto(`Certo! ${r.toLocaleString('pt-BR')}`);
    else feedbackErro(`Era ${jogoState.resposta.toLocaleString('pt-BR')}`, DICAS.decMil(jogoState.resposta));
  }
};

JOGOS.divResto = {
  iniciar() {
    const fd = pickNivel([[2,4],[3,7],[5,9]], 'divResto');

    const divisor = rand(fd[1], fd[0]);

// FRAÇÕES - destaque do 4º ano

function fracPizzaSvg(num, den) {
  const cx = 100, cy = 100, r = 85;
  let paths = [];
  for (let i = 0; i < den; i++) {
    const startAngle = (i / den) * 2 * Math.PI - Math.PI / 2;
    const endAngle = ((i + 1) / den) * 2 * Math.PI - Math.PI / 2;
    const x1 = cx + r * Math.cos(startAngle), y1 = cy + r * Math.sin(startAngle);
    const x2 = cx + r * Math.cos(endAngle), y2 = cy + r * Math.sin(endAngle);
    const largeArc = (endAngle - startAngle) > Math.PI ? 1 : 0;
    const color = i < num ? '#ff9a44' : '#fff';
    paths.push(`<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z" fill="${color}" stroke="#4a3b8a" stroke-width="2"/>`);
  }
  return `<svg width="200" height="200" viewBox="0 0 200 200">${paths.join('')}</svg>`;
}

    {tipo:'concorrentes', svg:'<line x1="20" y1="30" x2="180" y2="110" stroke="#ff7b6b" stroke-width="4"/><line x1="20" y1="110" x2="180" y2="40" stroke="#4ab3a5" stroke-width="4"/>'}
  ],
  iniciar() {
    const e = escolher(this.exemplos);
    jogoState.resposta = e.tipo;
    document.getElementById('jogo-conteudo').innerHTML = `
      <div class="pergunta">Como são essas retas?</div>
      <svg width="200" height="140" viewBox="0 0 200 140">${e.svg}</svg>
      <div class="opcoes q3">
        <button onclick="JOGOS.retas.conferir('paralelas')">Paralelas</button>
        <button onclick="JOGOS.retas.conferir('perpendiculares')">Perpendiculares</button>
        <button onclick="JOGOS.retas.conferir('concorrentes')">Concorrentes</button>
      </div>
      <div class="feedback" id="feedback"></div>`;
  },
  conferir(escolha) {
    if (escolha === jogoState.resposta) feedbackAcerto(`Isso! São ${escolha}`);
    else feedbackErro(`Eram ${jogoState.resposta}`, DICAS.retas(jogoState.resposta));
  }
};

JOGOS.perim = {
  iniciar() {
    const tiposPorNivel = pickNivel([
      ['quadrado','retangulo'],
      ['quadrado','retangulo','triangulo'],
      ['quadrado','retangulo','triangulo']
    ], 'perim');
    const fl = pickNivel([[3,6],[3,10],[3,15]], 'perim');
    const tipo = escolher(tiposPorNivel);
    let lados, perim, svg, desc;
    if (tipo === 'quadrado') {
      const l = rand(fl[1], fl[0]);
      lados = [l,l,l,l]; perim = 4*l;
      svg = `<rect x="40" y="20" width="80" height="80" fill="#ffd36b" stroke="#4a3b8a" stroke-width="3"/>
             <text x="80" y="14" text-anchor="middle" font-size="14" font-weight="700" fill="#4a3b8a">${l}</text>
             <text x="128" y="65" font-size="14" font-weight="700" fill="#4a3b8a">${l}</text>
             <text x="80" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#4a3b8a">${l}</text>
             <text x="30" y="65" text-anchor="end" font-size="14" font-weight="700" fill="#4a3b8a">${l}</text>`;
      desc = `Quadrado com lado ${l}`;
    } else if (tipo === 'retangulo') {
      const a = rand(fl[1], Math.max(fl[0], 4)), b = rand(Math.max(2, fl[1]-4), 2);
      lados = [a,b,a,b]; perim = 2*(a+b);
      svg = `<rect x="20" y="30" width="120" height="60" fill="#4ab3a5" stroke="#4a3b8a" stroke-width="3"/>
             <text x="80" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#4a3b8a">${a}</text>
             <text x="148" y="65" font-size="14" font-weight="700" fill="#4a3b8a">${b}</text>
             <text x="80" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#4a3b8a">${a}</text>
             <text x="10" y="65" text-anchor="end" font-size="14" font-weight="700" fill="#4a3b8a">${b}</text>`;
      desc = `Retângulo ${a}×${b}`;
    } else {
      const l = rand(fl[1], fl[0]);
      lados = [l,l,l]; perim = 3*l;
      svg = `<polygon points="80,15 20,105 140,105" fill="#ff7b6b" stroke="#4a3b8a" stroke-width="3"/>
             <text x="42" y="55" font-size="14" font-weight="700" fill="#4a3b8a">${l}</text>
             <text x="115" y="55" font-size="14" font-weight="700" fill="#4a3b8a">${l}</text>
             <text x="80" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#4a3b8a">${l}</text>`;
      desc = `Triângulo equilátero com lado ${l}`;
    }
    jogoState.resposta = perim; jogoState.desc = desc;
    document.getElementById('jogo-conteudo').innerHTML = `
      <div class="pergunta">Qual o perímetro?<br><small style="font-size:13px;color:#888">${desc}</small></div>
      <svg width="180" height="130" viewBox="0 0 180 130">${svg}</svg>
      <input type="number" id="resp" placeholder="?">
      <div class="botoes"><button class="acao" onclick="JOGOS.perim.conferir()">Conferir</button></div>
      <div class="feedback" id="feedback"></div>`;
    document.getElementById('resp').focus();
    document.getElementById('resp').addEventListener('keydown', e => { if (e.key==='Enter') JOGOS.perim.conferir(); });
  },
  conferir() {
    const r = parseInt(document.getElementById('resp').value);
    if (isNaN(r)) return feedbackErro('Digite um número!');
    if (r === jogoState.resposta) feedbackAcerto(`Certo! Perímetro = ${r}`);
    else feedbackErro(`Era ${jogoState.resposta}`, DICAS.perim(jogoState.resposta));
  }
};

JOGOS.valorPos = {
  iniciar() {
    const n = randNivel([[100, 999], [1000, 9999], [10000, 99999]], 'valorPos');
    const str = String(n);
    const pos = rand(str.length - 1, 0);
    const alg = parseInt(str[pos]);
    const posicaoValor = Math.pow(10, str.length - 1 - pos);
    const resposta = alg * posicaoValor;
    const nomePos = ['unidade','dezena','centena','milhar','dezena de milhar'][str.length - 1 - pos];
    jogoState.resposta = resposta; jogoState.alg = alg; jogoState.nomePos = nomePos;
    const opcoes = new Set([resposta]);
    opcoes.add(alg);
    if (alg > 0) { opcoes.add(alg * 10); opcoes.add(alg * 100); }
    while (opcoes.size < 4) opcoes.add(rand(9, 1) * Math.pow(10, rand(4, 0)));
    const arr = [...opcoes].sort(() => Math.random() - 0.5);
    const strDestaque = str.split('').map((c, i) =>
      i === pos ? `<span style="color:#ff7b6b;font-size:48px;font-weight:900">${c}</span>` : c
    ).join('');
    document.getElementById('jogo-conteudo').innerHTML = `
      <div class="pergunta" style="font-size:19px">Quanto vale o algarismo destacado?<br>
        <span style="font-size:38px;font-family:'Courier New',monospace;color:#4a3b8a;display:block;margin:12px 0">${strDestaque}</span></div>
      <div class="opcoes q4">${arr.map(o => `<button onclick="JOGOS.valorPos.conferir(${o})" style="font-size:22px">${o.toLocaleString('pt-BR')}</button>`).join('')}</div>
      <div class="feedback" id="feedback"></div>`;
  },
  conferir(escolha) {
    if (escolha === jogoState.resposta) feedbackAcerto(`Isso! ${escolha.toLocaleString('pt-BR')}`);
    else feedbackErro(`Era ${jogoState.resposta.toLocaleString('pt-BR')}`, DICAS.valorPos(jogoState.alg, jogoState.nomePos, jogoState.resposta));
  }
};

JOGOS.fracColec = {
  iniciar() {
    const dens = pickNivel([[2,3,4],[2,3,4,5],[2,3,4,5,6]], 'fracColec');
    const fm = pickNivel([[2,3],[2,4],[2,6]], 'fracColec');
    const den = escolher(dens);
    const num = rand(den - 1, 1);
    const multiplicador = rand(fm[1], fm[0]);
    const total = den * multiplicador;
    const resposta = num * multiplicador;
    jogoState.resposta = resposta; jogoState.total = total; jogoState.den = den; jogoState.num = num;
    let bolas = '';
    for (let i = 0; i < total; i++) {
      bolas += `<span style="display:inline-block;width:22px;height:22px;background:#5ba8e8;border:2px solid #4a3b8a;border-radius:50%;margin:2px"></span>`;
    }
    const opcoes = new Set([resposta]);
    while (opcoes.size < 4) opcoes.add(rand(total, 1));
    const arr = [...opcoes].sort(() => Math.random() - 0.5);
    document.getElementById('jogo-conteudo').innerHTML = `
      <div class="pergunta" style="font-size:18px">Quanto é
        <span class="fracao-visual"><span class="num-f">${num}</span><span class="den-f">${den}</span></span>
        de <b>${total}</b> bolas?</div>
      <div style="text-align:center;background:#f7f5ff;border-radius:14px;padding:14px;margin:10px 0;line-height:1">${bolas}</div>
      <div class="opcoes q4">${arr.map(o => `<button onclick="JOGOS.fracColec.conferir(${o})" style="font-size:22px">${o}</button>`).join('')}</div>
      <div class="feedback" id="feedback"></div>`;
  },
  conferir(escolha) {
    if (escolha === jogoState.resposta) feedbackAcerto(`Isso! ${escolha} bolas`);
    else feedbackErro(`Eram ${jogoState.resposta}`, DICAS.fracColec(jogoState.total, jogoState.den, jogoState.total / jogoState.den));
  }
};

initJogos();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
