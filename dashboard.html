function dicaBoalerDaSemana() {
  // Usa a semana do ano pra determinar qual dica mostrar (rotação consistente ao longo da semana).
  const hoje = new Date();
  const jan1 = new Date(hoje.getFullYear(), 0, 1);
  const dias = Math.floor((hoje - jan1) / 86400000);
  const semana = Math.floor(dias / 7);
  return DICAS_BOALER[semana % DICAS_BOALER.length];
}

  const slot = document.getElementById('dica-boaler-slot');
  if (!slot) return;
  const d = dicaBoalerDaSemana();

function loadAno(ano) {
  try { return JSON.parse(localStorage.getItem(CHAVES[ano]) || '{}'); }
  catch (e) { return {}; }
}

function loadProvas() {
  try { return JSON.parse(localStorage.getItem('jogosMat_provas_v1') || '[]'); }
  catch (e) { return []; }
}

function nivelDe(xp) { return Math.floor(Math.sqrt((xp || 0) / 50)) + 1; }

// ========================================
// GRÁFICO DE LINHA (desempenho diário)
// ========================================
// Monta série temporal: pra cada prova executada, tira o % de acerto daquele dia
// E também usa os diasJogados + taxa global do dia
function gerarSerieDiaria(ano /* ou null pra todos */) {
  const provas = loadProvas();
  const pontosPorDia = {}; // { '2026-04-22': { acertos, total } }

  // De provas (tem timestamp exato)
  provas.forEach(p => {
    if (ano && String(p.ano) !== String(ano)) return;
    (p.historico || []).forEach(h => {
      const dia = h.data.slice(0, 10);
      if (!pontosPorDia[dia]) pontosPorDia[dia] = { acertos: 0, total: 0 };
      pontosPorDia[dia].acertos += h.acertos;
      pontosPorDia[dia].total += h.total;
    });
  });

  // De jogos livres (só temos "diasJogados" + porJogo agregado, sem data por dia)
  // Por isso, gráfico de linha representa principalmente as provas + atividade geral marcada nos últimos 14 dias
  const hoje = new Date();
  const serie = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(hoje); d.setDate(hoje.getDate() - i);
    const diaStr = d.toISOString().slice(0, 10);
    const p = pontosPorDia[diaStr];
    serie.push({
      data: diaStr,
      dia: d.getDate(),
      mes: d.getMonth() + 1,
      temProva: !!p,
      pct: p && p.total > 0 ? Math.round(p.acertos / p.total * 100) : null
    });
  }
  return serie;
}

function renderGraficoLinha(ano) {
  const serie = gerarSerieDiaria(ano);
  const temDados = serie.some(p => p.pct !== null);
  if (!temDados) {
    return `<div class="vazio">
      Sem histórico de provas ainda.<br>
      <small>Faça uma prova em <a href="provas.html" style="color:#6b54d3">Provas</a> pra começar o histórico.</small>
    </div>`;
  }

  const w = 320, h = 140, pad = 28;
  const xStep = (w - 2 * pad) / (serie.length - 1);
  const yFrom = v => h - pad - (v / 100) * (h - 2 * pad);

  // Path da linha (só pontos com dados, conectados)
  let pathD = '';
  let pontos = [];
  serie.forEach((p, i) => {
    if (p.pct !== null) {
      const x = pad + i * xStep;
      const y = yFrom(p.pct);
      pathD += (pathD === '' ? 'M' : ' L') + ` ${x} ${y}`;
      pontos.push({ x, y, pct: p.pct, dia: p.dia, mes: p.mes });
    }
  });

  // Eixos / grid
  const gridLines = [0, 25, 50, 75, 100].map(v => {
    const y = yFrom(v);
    return `<line x1="${pad}" y1="${y}" x2="${w - pad}" y2="${y}" stroke="#e0dbf5" stroke-width="1"/>
            <text x="${pad - 4}" y="${y + 3}" text-anchor="end" font-size="9" fill="#888">${v}%</text>`;
  }).join('');

  // Labels eixo x (primeiro, meio, último com dados)
  const labels = serie.map((p, i) => {
    if (i % 3 !== 0 && i !== serie.length - 1) return '';
    const x = pad + i * xStep;
    return `<text x="${x}" y="${h - 10}" text-anchor="middle" font-size="9" fill="#888">${p.dia}/${String(p.mes).padStart(2,'0')}</text>`;
  }).join('');

  return `
    <div class="grafico-linha">
      <svg viewBox="0 0 ${w} ${h}">
        ${gridLines}
        ${pathD ? `<path d="${pathD}" fill="none" stroke="#6b54d3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
        ${pontos.map(p => `<circle cx="${p.x}" cy="${p.y}" r="4" fill="#6b54d3" stroke="#fff" stroke-width="2"><title>${p.dia}/${p.mes}: ${p.pct}%</title></circle>`).join('')}
        ${labels}
      </svg>
      <div class="grafico-legenda">
        <div class="item"><span class="pt" style="background:#6b54d3"></span>Taxa de acerto em provas</div>
      </div>
    </div>`;
}

// ========================================
// QUEBRA POR CAPÍTULO
// ========================================
function renderPorCapitulo(ano) {
  const d = loadAno(ano);
  const porJogo = d.porJogo || {};
  const estrutura = ESTRUTURA_ANOS[ano];
  if (!estrutura) return '';

  return Object.entries(estrutura.caps).map(([capNum, cap]) => {
    const jogosDoCap = cap.jogos.map(jid => {
      const j = porJogo[jid] || {acertos:0, tentativas:0};
      return { id: jid, nome: JOGOS_NOMES[jid] || jid,
        acertos: j.acertos || 0, tentativas: j.tentativas || 0,
        erros: (j.tentativas || 0) - (j.acertos || 0),
        taxa: j.tentativas ? (j.acertos / j.tentativas) : -1 };
    });
    const totTent = jogosDoCap.reduce((s, j) => s + j.tentativas, 0);
    const totAc = jogosDoCap.reduce((s, j) => s + j.acertos, 0);
    const taxaGeral = totTent > 0 ? Math.round(totAc / totTent * 100) : -1;
    const classeTaxa = taxaGeral < 0 ? 'vazio' : taxaGeral >= 80 ? 'ok' : taxaGeral >= 60 ? 'med' : 'bad';
    const txtTaxa = taxaGeral < 0 ? 'sem dados' : `${taxaGeral}%`;

    return `
      <div class="cap-bloco">
        <div class="cap-head">
          <div class="cap-nome">Cap. ${capNum} — ${cap.nome}</div>
          <span class="cap-taxa ${classeTaxa}">${txtTaxa}</span>
        </div>
        ${jogosDoCap.map(j => {
          if (j.tentativas === 0) {
            return `<div class="jogo-row" style="opacity:0.5">
              <span class="nome">${j.nome}</span>
              <span class="stat" style="font-size:11px;color:#aaa">não jogado</span>
            </div>`;
          }
          const pct = Math.round(j.taxa * 100);
          return `<div class="jogo-row">
            <span class="nome">${j.nome}</span>
            <div class="barra"><div class="fill" style="width:${j.taxa * 100}%"></div></div>
            <span class="stat ${pct >= 80 ? 'ok' : pct < 60 ? 'err' : ''}">${j.acertos}/${j.tentativas}</span>
            <span class="stat">${pct}%</span>
          </div>`;
        }).join('')}
      </div>`;
  }).join('');
}

// ========================================
// HISTÓRICO DE PROVAS
// ========================================
function renderHistoricoProvas(ano /* ou null */) {
  const provas = loadProvas();
  const execs = [];
  provas.forEach(p => {
    if (ano && String(p.ano) !== String(ano)) return;
    (p.historico || []).forEach(h => {
      execs.push({ prova: p.nome, ano: p.ano, ...h });
    });
  });
  execs.sort((a, b) => b.data.localeCompare(a.data));
  const recentes = execs.slice(0, 10);

  if (recentes.length === 0) return '<div class="vazio">Nenhuma prova feita ainda.</div>';

  return recentes.map(e => {
    const dia = new Date(e.data);
    const diaTxt = `${dia.getDate()}/${String(dia.getMonth() + 1).padStart(2, '0')}`;
    const pct = e.pct || Math.round(e.acertos / e.total * 100);
    const cor = pct >= 80 ? '#4ab3a5' : pct >= 60 ? '#ffd36b' : '#ff7b6b';
    const corTxt = pct >= 80 ? '#1b7a3a' : pct >= 60 ? '#a87800' : '#a83232';
    const bgTxt = pct >= 80 ? '#d4f5dd' : pct >= 60 ? '#fff3d6' : '#fde0e0';
    return `
      <div class="prova-hist-card">
        <span class="prova-resultado" style="background:${bgTxt};color:${corTxt}">${pct}%</span>
        <div class="prova-nome">${e.prova}</div>
        <div class="prova-meta">${diaTxt} · ${ESTRUTURA_ANOS[e.ano]?.nome} · ${e.acertos}/${e.total}</div>
      </div>`;
  }).join('');
}

// ========================================
// VIEW POR ANO
// ========================================
function renderAno(ano) {
  const d = loadAno(ano);
  const estrelas = d.estrelas || 0;
  const xp = d.xp || 0;
  const moedas = d.moedas || 0;
  const streak = d.streakDiario || 0;
  const recorde = d.recorde || 0;
  const badges = d.badges || [];
  const porJogo = d.porJogo || {};
  const diasJogados = d.diasJogados || [];
  const nivel = nivelDe(xp);

  const jogosList = Object.entries(porJogo).map(([id, j]) => ({
    id, nome: JOGOS_NOMES[id] || id,
    acertos: j.acertos || 0, tentativas: j.tentativas || 0,
    taxa: j.tentativas ? (j.acertos / j.tentativas) : 0,
    erros: (j.tentativas || 0) - (j.acertos || 0)
  }));
  const piores = [...jogosList].filter(j => j.tentativas >= 3).sort((a,b) => a.taxa - b.taxa).slice(0, 5);

  // Heatmap 28 dias
  const heatmap = [];
  const hoje = new Date();
  for (let i = 27; i >= 0; i--) {
    const d = new Date(hoje); d.setDate(hoje.getDate() - i);
    const str = d.toISOString().slice(0, 10);
    heatmap.push({ str, jogado: diasJogados.includes(str), dia: d.getDate() });
  }

  let html = `
    <div class="resumo-grid">
      <div class="card-stat gold"><div class="valor">⭐ ${estrelas}</div><div class="label">Estrelas totais</div></div>
      <div class="card-stat"><div class="valor">Nv ${nivel}</div><div class="label">${xp} XP</div></div>
      <div class="card-stat gold"><div class="valor">🪙 ${moedas}</div><div class="label">Moedas</div></div>
      <div class="card-stat"><div class="valor">🔥 ${streak}</div><div class="label">Dias seguidos</div></div>
      <div class="card-stat"><div class="valor">🏆 ${recorde}</div><div class="label">Maior combo</div></div>
      <div class="card-stat"><div class="valor">📅 ${diasJogados.length}</div><div class="label">Dias jogados</div></div>
    </div>

    <div class="sessao-titulo">📈 Desempenho em provas (últimos 14 dias)</div>
    ${renderGraficoLinha(ano)}

    <div class="sessao-titulo">📚 Por capítulo / tipo de exercício</div>
    ${renderPorCapitulo(ano)}

    <div class="sessao-titulo">⚠️ Onde mais erra (precisa treinar)</div>`;

  if (piores.length === 0) {
    html += '<div class="vazio">Precisa jogar pelo menos 3 vezes cada jogo pra análise sair.</div>';
  } else {
    html += piores.map(j => {
      const pct = Math.round(j.taxa * 100);
      return `<div class="jogo-row">
        <span class="nome">${j.nome}</span>
        <div class="barra"><div class="fill" style="width:${j.taxa * 100}%"></div></div>
        <span class="stat err">${j.erros} erros</span>
        <span class="stat">${pct}%</span>
      </div>`;
    }).join('');
  }

  html += `<div class="sessao-titulo">📝 Histórico de provas</div>${renderHistoricoProvas(ano)}`;

  html += `<div class="sessao-titulo">📅 Últimos 28 dias</div>
    <div class="heat-days">
      ${heatmap.map(h => `<div class="heat-dia ${h.jogado ? 'jogado' : ''}" title="${h.str}">${h.dia}</div>`).join('')}
    </div>`;

  html += `<div class="sessao-titulo">🏅 Conquistas (${badges.length}/${Object.keys(BADGES).length})</div>`;
  if (badges.length === 0) html += '<div class="vazio">Nenhuma conquista ainda.</div>';
  else {
    html += '<div class="badges-row">' +
      badges.map(key => BADGES[key] ? `<div class="badge-mini"><div class="emoji">${BADGES[key].emoji}</div><div class="nome">${BADGES[key].nome}</div></div>` : '').join('') +
      '</div>';
  }

  return html;
}

// ========================================
// VIEW TODOS OS ANOS
// ========================================
function renderTodos() {
  const totais = {
    estrelas: 0, xp: 0, moedas: 0, dias: new Set(), badges: 0,
    tentativas: 0, acertos: 0
  };
  const jogosGlobal = [];

  for (const ano of [1,2,3,4,5]) {
    const d = loadAno(ano);
    totais.estrelas += d.estrelas || 0;
    totais.xp += d.xp || 0;
    totais.moedas += d.moedas || 0;
    totais.badges += (d.badges || []).length;
    (d.diasJogados || []).forEach(x => totais.dias.add(x));
    for (const [id, j] of Object.entries(d.porJogo || {})) {
      totais.tentativas += j.tentativas || 0;
      totais.acertos += j.acertos || 0;
      jogosGlobal.push({ id, ano, nome: JOGOS_NOMES[id] || id,
        acertos: j.acertos || 0, tentativas: j.tentativas || 0,
        taxa: j.tentativas ? (j.acertos / j.tentativas) : 0,
        erros: (j.tentativas || 0) - (j.acertos || 0) });
    }
  }

  const piores = jogosGlobal.filter(j => j.tentativas >= 3).sort((a,b) => a.taxa - b.taxa).slice(0, 5);
  const taxaGeral = totais.tentativas ? Math.round((totais.acertos / totais.tentativas) * 100) : 0;

  let html = `
    <div class="todos-anos-header">
      <div style="text-align:center">
        <div class="total">⭐ ${totais.estrelas}</div>
        <div class="label">estrelas totais · ${taxaGeral}% de acerto geral</div>
      </div>
    </div>

    <div class="resumo-grid">
      <div class="card-stat"><div class="valor">${totais.xp}</div><div class="label">XP acumulado</div></div>
      <div class="card-stat gold"><div class="valor">🪙 ${totais.moedas}</div><div class="label">Moedas totais</div></div>
      <div class="card-stat"><div class="valor">📅 ${totais.dias.size}</div><div class="label">Dias jogando</div></div>
      <div class="card-stat"><div class="valor">🏅 ${totais.badges}</div><div class="label">Conquistas</div></div>
    </div>

    <div class="sessao-titulo">📈 Desempenho em provas (últimos 14 dias)</div>
    ${renderGraficoLinha(null)}

    <div class="sessao-titulo">📊 Progresso por ano</div>`;

  for (const ano of [1,2,3,4,5]) {
    const d = loadAno(ano);
    const est = d.estrelas || 0;
    const nivel = nivelDe(d.xp || 0);
    const cor = ['#ff7b6b','#4ab3a5','#f2a541','#5ba8e8','#b968e8'][ano - 1];
    // calcula taxa geral do ano
    const porJ = d.porJogo || {};
    let tent = 0, ac = 0;
    Object.values(porJ).forEach(j => { tent += j.tentativas || 0; ac += j.acertos || 0; });
    const pctAno = tent > 0 ? Math.round(ac / tent * 100) : -1;
    html += `
      <div class="jogo-row">
        <span style="font-weight:800;font-size:18px;color:${cor};min-width:32px">${ano}º</span>
        <span class="nome">Ano ${ano}</span>
        <span class="stat">Nv ${nivel}</span>
        <span class="stat ok">⭐ ${est}</span>
        <span class="stat">${pctAno >= 0 ? pctAno + '%' : '-'}</span>
      </div>`;
  }

  html += `<div class="sessao-titulo">⚠️ Top 5 onde mais erra (todos os anos)</div>`;
  if (piores.length === 0) {
    html += '<div class="vazio">Ainda não tem dados suficientes.</div>';
  } else {
    html += piores.map(j => {
      const pct = Math.round(j.taxa * 100);
      return `<div class="jogo-row">
        <span style="font-size:11px;color:#888;min-width:26px">${j.ano}º</span>
        <span class="nome">${j.nome}</span>
        <div class="barra"><div class="fill" style="width:${j.taxa * 100}%"></div></div>
        <span class="stat err">${j.erros} erros</span>
        <span class="stat">${pct}%</span>
      </div>`;
    }).join('');
  }

  html += `<div class="sessao-titulo">📝 Histórico de provas (todas)</div>${renderHistoricoProvas(null)}`;

  return html;
}

function trocarAno(ano, ev) {
  document.querySelectorAll('.ano-tab').forEach(t => t.classList.remove('ativo'));
  if (ev) ev.target.classList.add('ativo');
  document.getElementById('conteudo').innerHTML = ano === 'todos' ? renderTodos() : renderAno(ano);
}

document.getElementById('conteudo').innerHTML = renderTodos();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
