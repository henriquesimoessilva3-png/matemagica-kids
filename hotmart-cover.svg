<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="1" stop-color="#764ba2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background gradient -->
  <rect width="1000" height="1000" fill="url(#bg)"/>

  <!-- Decorative stars -->
  <text x="120" y="150" font-size="48" fill="#ffd36b" opacity="0.6">✦</text>
  <text x="860" y="180" font-size="36" fill="#ffd36b" opacity="0.5">✧</text>
  <text x="880" y="880" font-size="52" fill="#ffd36b" opacity="0.6">✦</text>
  <text x="100" y="860" font-size="40" fill="#ffd36b" opacity="0.5">✧</text>

  <!-- Floating math symbols (background) -->
  <text x="140" y="400" font-size="88" fill="#fff" opacity="0.10" font-weight="800">+</text>
  <text x="820" y="620" font-size="88" fill="#fff" opacity="0.10" font-weight="800">×</text>
  <text x="170" y="700" font-size="88" fill="#fff" opacity="0.10" font-weight="800">÷</text>
  <text x="810" y="380" font-size="88" fill="#fff" opacity="0.10" font-weight="800">−</text>

  <!-- Main numbers (visual anchor) -->
  <text x="500" y="380" text-anchor="middle" font-size="180" font-family="Arial, sans-serif" font-weight="800" fill="#fff" filter="url(#glow)">1 2</text>
  <text x="500" y="570" text-anchor="middle" font-size="180" font-family="Arial, sans-serif" font-weight="800" fill="#ffd36b" filter="url(#glow)">3 4</text>

  <!-- Brand name -->
  <text x="500" y="720" text-anchor="middle" font-size="96" font-family="Arial, sans-serif" font-weight="900" fill="#fff" letter-spacing="2">Matemágica</text>

  <!-- Tagline -->
  <text x="500" y="790" text-anchor="middle" font-size="38" font-family="Arial, sans-serif" font-weight="600" fill="#fff" opacity="0.92">Matemática sem medo — 1º ao 5º ano</text>

  <!-- Badges -->
  <g transform="translate(290,860)">
    <rect x="0" y="0" width="140" height="50" rx="25" fill="#fff" opacity="0.18"/>
    <text x="70" y="33" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" font-weight="700" fill="#fff">BNCC</text>
  </g>
  <g transform="translate(440,860)">
    <rect x="0" y="0" width="140" height="50" rx="25" fill="#fff" opacity="0.18"/>
    <text x="70" y="33" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" font-weight="700" fill="#fff">VITALÍCIO</text>
  </g>
  <g transform="translate(590,860)">
    <rect x="0" y="0" width="120" height="50" rx="25" fill="#ffd36b"/>
    <text x="60" y="33" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" font-weight="800" fill="#5a3a90">R$ 17</text>
  </g>
</svg>
