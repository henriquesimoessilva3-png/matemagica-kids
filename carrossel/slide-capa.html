<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Slide Capa — Carta Aberta</title>
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1350px;
    overflow: hidden;
  }
  body {
    font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Roboto, sans-serif;
    background: linear-gradient(135deg, #8a72e8 0%, #6b54d3 55%, #5a44c0 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    padding: 90px 90px 80px;
    position: relative;
  }
  .logo {
    text-align: center;
    font-size: 32px; font-weight: 800; letter-spacing: 4px;
    color: #fff; margin-bottom: 90px;
  }
  .logo .star { color: #ffd36b; }
  .label {
    font-size: 30px; font-weight: 900;
    color: #ffd36b;
    letter-spacing: 6px;
    margin-bottom: 38px;
    text-transform: uppercase;
  }
  .headline {
    font-size: 90px; font-weight: 900; line-height: 1.04;
    color: #fff; letter-spacing: -1.5px;
    margin: 0;
  }
  .headline .price {
    color: #ffd36b;
  }
  .arrasta {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 22px;
    background: #ffd36b;
    color: #2a2245;
    padding: 26px 40px;
    border-radius: 18px;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 2px;
    align-self: flex-start;
    box-shadow: 0 8px 30px rgba(0,0,0,0.18);
  }
  .arrasta .arrow {
    font-size: 44px;
    line-height: 1;
    animation: nudge 1.4s ease-in-out infinite;
  }
  @keyframes nudge {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(8px); }
  }
</style>
</head>
<body>
  <div class="logo">MATE<span class="star">✦</span>MÁGICA</div>
  <div class="label">Carta aberta</div>
  <h1 class="headline">Por que cobrei só <span class="price">R$ 17</span><br>(uma vez) pelo Matemágica.</h1>
  <div class="arrasta">
    <span>ARRASTA</span>
    <span class="arrow">→</span>
  </div>
</body>
</html>
