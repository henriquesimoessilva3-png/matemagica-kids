<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Slide 6 — Sinal 5 de 5</title>
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1350px;
    overflow: hidden;
  }
  body {
    font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Roboto, sans-serif;
    background: #ffffff;
    color: #2a2245;
    display: flex;
    flex-direction: column;
    padding: 90px 90px 80px;
    position: relative;
  }
  .logo {
    text-align: center;
    font-size: 26px; font-weight: 800; letter-spacing: 4px;
    color: #6b54d3; margin-bottom: 80px;
  }
  .logo .star { color: #ffd36b; }

  .number-block {
    display: flex;
    align-items: flex-start;
    gap: 50px;
    margin-bottom: 60px;
  }
  .number {
    font-size: 360px;
    font-weight: 900;
    color: #ffd36b;
    line-height: 0.85;
    letter-spacing: -8px;
    -webkit-text-stroke: 4px #6b54d3;
    text-shadow: 8px 8px 0 rgba(107,84,211,0.18);
    flex-shrink: 0;
  }
  .number-side {
    padding-top: 30px;
  }
  .headline {
    font-size: 84px; font-weight: 900; line-height: 1.05;
    color: #2a2245; letter-spacing: -1.5px;
    margin: 0;
  }

  .sub {
    font-size: 44px; font-weight: 500; line-height: 1.32;
    color: #6a5f88; margin-top: 30px;
  }
  .sub strong { color: #2a2245; font-weight: 800; }

  .footer {
    margin-top: auto;
    text-align: center;
    font-size: 28px; font-weight: 800;
    color: #b0a3c8;
    letter-spacing: 6px;
    text-transform: uppercase;
    border-top: 3px solid #f0eaff;
    padding-top: 30px;
  }
</style>
</head>
<body>
  <div class="logo">MATE<span class="star">✦</span>MÁGICA</div>

  <div class="number-block">
    <div class="number">5</div>
    <div class="number-side">
      <h1 class="headline">Não pede<br>ajuda mais.</h1>
    </div>
  </div>

  <p class="sub">Internalizou que matemática <strong>"não é pra ele"</strong>.<br>Esse é o sinal que mais merece atenção — e é reversível.</p>

  <div class="footer">Sinal 5 de 5</div>
</body>
</html>
