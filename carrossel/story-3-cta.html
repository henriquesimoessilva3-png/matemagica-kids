<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Story 3 — CTA Carta Aberta</title>
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px; height: 1920px;
    overflow: hidden;
  }
  body {
    font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Roboto, sans-serif;
    background: linear-gradient(160deg, #8a72e8 0%, #6b54d3 60%, #4a3899 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    padding: 160px 90px 100px;
    position: relative;
  }
  .logo {
    text-align: center;
    font-size: 32px; font-weight: 800; letter-spacing: 4px;
    color: #fff; margin-bottom: 70px;
  }
  .logo .star { color: #ffd36b; }
  .pre-headline {
    text-align: center;
    font-size: 38px; font-weight: 700;
    color: #ffd36b;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 30px;
  }
  .headline {
    text-align: center;
    font-size: 110px; font-weight: 900; line-height: 1.02;
    color: #fff; letter-spacing: -2px;
    margin-bottom: 40px;
  }
  .headline .accent { color: #ffd36b; }
  .sub {
    text-align: center;
    font-size: 38px; font-weight: 700;
    color: #fff;
    opacity: 0.95;
    line-height: 1.3;
    margin-bottom: 60px;
  }
  .sticker-zone {
    background: rgba(255, 211, 107, 0.18);
    border: 4px dashed #ffd36b;
    border-radius: 32px;
    padding: 50px 40px;
    text-align: center;
    margin-bottom: 50px;
  }
  .sticker-zone .label {
    font-size: 26px;
    font-weight: 800;
    color: #ffd36b;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .sticker-zone .desc {
    font-size: 36px;
    font-weight: 700;
    color: #fff;
    line-height: 1.3;
  }
  .url {
    text-align: center;
    font-size: 34px; font-weight: 700;
    color: #fff;
    margin-top: auto;
    opacity: 0.92;
  }
  .url strong {
    color: #ffd36b; font-weight: 900;
  }
</style>
</head>
<body>
  <div class="logo">MATE<span class="star">✦</span>MÁGICA</div>
  <div class="pre-headline">Antes que ele odeie</div>
  <h1 class="headline">Vê por <span class="accent">dentro</span><br>do app.</h1>
  <div class="sub">Pagamento único · 7 dias de garantia</div>

  <div class="sticker-zone">
    <div class="label">⬇ Cole aqui ⬇</div>
    <div class="desc">o sticker de LINK<br>apontando pra vitrine</div>
  </div>

  <div class="url">matemagica.app.br<strong>/vitrine</strong></div>
</body>
</html>
