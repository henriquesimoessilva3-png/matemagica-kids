<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {

    overflow: hidden;
  }
  body {
    font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Roboto, sans-serif;
    background: linear-gradient(135deg, #8a72e8 0%, #6b54d3 55%, #5a44c0 100%);

    display: flex;

  }
  .logo {

  }
  .logo .star { color: #ffd36b; }
  .label {
    font-size: 28px; font-weight: 900;
    color: #ffd36b;
    letter-spacing: 6px;
    margin-bottom: 40px;

  }
  .number {
    font-size: 280px;
    font-weight: 900;
    color: #ffd36b;
    line-height: 0.85;
    letter-spacing: -8px;
    margin-bottom: 30px;

  }
  .headline {
    font-size: 72px; font-weight: 900; line-height: 1.05;
    color: #fff; letter-spacing: -1.5px;

  }

    font-size: 36px; font-weight: 600; line-height: 1.32;

    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 22px;
    background: #ffd36b;
    color: #2a2245;
    padding: 26px 40px;
    border-radius: 18px;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 2px;
    align-self: flex-start;
    box-shadow: 0 8px 30px rgba(0,0,0,0.18);
  }
  .arrasta .arrow {
    font-size: 44px;
    line-height: 1;
    animation: nudge 1.4s ease-in-out infinite;
  }
  @keyframes nudge {
    0%, 100% { transform: translateX(0); }

  }
