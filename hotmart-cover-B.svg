<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="topAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e8ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="1" stop-color="#764ba2"/>
    </linearGradient>
  </defs>

  <!-- Soft white background with top accent -->
  <rect width="1000" height="1000" fill="#ffffff"/>
  <rect width="1000" height="400" fill="url(#topAccent)"/>

  <!-- Notebook-style math equation (subtle, top-left) -->
  <g opacity="0.25">
    <text x="90" y="180" font-size="34" font-family="Georgia, serif" font-weight="400" fill="#764ba2">3 + 4 = 7</text>
    <text x="90" y="230" font-size="34" font-family="Georgia, serif" font-weight="400" fill="#764ba2">7 × 2 = 14</text>
    <text x="90" y="280" font-size="34" font-family="Georgia, serif" font-weight="400" fill="#764ba2">14 ÷ 2 = ?</text>
  </g>

  <!-- Top-right checkmark highlight -->
  <g transform="translate(810,150)" opacity="0.5">
    <circle cx="40" cy="40" r="38" fill="none" stroke="#764ba2" stroke-width="3"/>
    <path d="M22 40 L36 54 L58 28" stroke="#764ba2" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main brand name -->
  <text x="500" y="500" text-anchor="middle" font-size="140" font-family="Georgia, 'Times New Roman', serif" font-weight="900" fill="url(#brandGrad)" letter-spacing="-2">Matemágica</text>

  <!-- Divider -->
  <rect x="400" y="530" width="200" height="3" fill="#764ba2" opacity="0.4"/>

  <!-- Tagline — two line -->
  <text x="500" y="600" text-anchor="middle" font-size="42" font-family="Georgia, serif" font-weight="400" fill="#333" letter-spacing="0.5">Matemática sem medo de errar</text>
  <text x="500" y="650" text-anchor="middle" font-size="32" font-family="Arial, sans-serif" font-weight="500" fill="#666" letter-spacing="1">Para crianças do 1º ao 5º ano</text>

  <!-- Features row -->
  <g transform="translate(180,780)" font-family="Arial, sans-serif">
    <!-- Feature 1 -->
    <g>
      <circle cx="40" cy="40" r="28" fill="#667eea" opacity="0.15"/>
      <text x="40" y="50" text-anchor="middle" font-size="28" fill="#667eea" font-weight="800">✓</text>
      <text x="90" y="35" font-size="20" font-weight="700" fill="#333">BNCC</text>
      <text x="90" y="58" font-size="16" font-weight="400" fill="#666">1º-5º ano</text>
    </g>
    <!-- Feature 2 -->
    <g transform="translate(230,0)">
      <circle cx="40" cy="40" r="28" fill="#764ba2" opacity="0.15"/>
      <text x="40" y="50" text-anchor="middle" font-size="28" fill="#764ba2" font-weight="800">★</text>
      <text x="90" y="35" font-size="20" font-weight="700" fill="#333">Vitalício</text>
      <text x="90" y="58" font-size="16" font-weight="400" fill="#666">sem mensalidade</text>
    </g>
    <!-- Feature 3 -->
    <g transform="translate(480,0)">
      <circle cx="40" cy="40" r="28" fill="#ffd36b" opacity="0.35"/>
      <text x="40" y="52" text-anchor="middle" font-size="28" fill="#b88500" font-weight="800">$</text>
      <text x="90" y="35" font-size="20" font-weight="700" fill="#333">R$ 17</text>
      <text x="90" y="58" font-size="16" font-weight="400" fill="#666">uma vez só</text>
    </g>
  </g>
</svg>
