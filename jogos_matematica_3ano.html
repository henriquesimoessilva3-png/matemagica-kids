const POR_EXTENSO = {
  0:'zero',1:'um',2:'dois',3:'três',4:'quatro',5:'cinco',6:'seis',7:'sete',8:'oito',9:'nove',
  10:'dez',11:'onze',12:'doze',13:'treze',14:'quatorze',15:'quinze',16:'dezesseis',17:'dezessete',18:'dezoito',19:'dezenove',
  20:'vinte',30:'trinta',40:'quarenta',50:'cinquenta',60:'sessenta',70:'setenta',80:'oitenta',90:'noventa',
  100:'cem',200:'duzentos',300:'trezentos',400:'quatrocentos',500:'quinhentos',
  600:'seiscentos',700:'setecentos',800:'oitocentos',900:'novecentos'
};
function numeroPorExtenso(n) {
  if (POR_EXTENSO[n]) return POR_EXTENSO[n];
  const c = Math.floor(n/100)*100;
  const resto = n - c;
  const d = Math.floor(resto/10)*10;
  const u = resto%10;
  let partes = [];
  if (c > 0) partes.push(POR_EXTENSO[c === 100 && resto > 0 ? 100 : c]);
  if (c === 100 && resto > 0) partes[0] = 'cento';
  if (d >= 20) {
    partes.push(POR_EXTENSO[d]);
    if (u > 0) partes.push(POR_EXTENSO[u]);
  } else if (resto > 0) {
    partes.push(POR_EXTENSO[resto]);
  }
  return partes.join(' e ');
}

JOGOS.lerMilhar = {
  iniciar() {
    const fx = pickNivel([[10,99],[100,999],[200,9999]], 'lerMilhar');
    const n = rand(fx[1], fx[0]);
    jogoState.resposta = n;
    const opcoes = new Set([n]);
    while (opcoes.size < 4) opcoes.add(rand(fx[1], fx[0]));
    const arr = [...opcoes].sort(() => Math.random() - 0.5);
    document.getElementById('jogo-conteudo').innerHTML = `
      <div class="pergunta">Qual é este número?<br><span style="font-size:20px;color:#6b54d3">${numeroPorExtenso(n)}</span></div>
      <div class="opcoes q4">${arr.map(o => `<button onclick="JOGOS.lerMilhar.conferir(${o})" style="font-size:26px">${o}</button>`).join('')}</div>
      <div class="feedback" id="feedback"></div>`;
  },
  conferir(escolha) {
    if (escolha === jogoState.resposta) feedbackAcerto(`Certo! ${escolha}`);
    else feedbackErro(`Era ${jogoState.resposta}`, DICAS.lerMilhar(jogoState.resposta));
  }
};

JOGOS.compMilhar = {
  iniciar() {
    const fx = pickNivel([[10,99],[100,999],[1000,9999]], 'compMilhar');
    let a = rand(fx[1], fx[0]), b = rand(fx[1], fx[0]);
    while (a === b) b = rand(fx[1], fx[0]);
    const procuraMaior = rand(1, 0) === 1;

JOGOS.arredonda = {
  iniciar() {
    const fx = pickNivel([[11,49],[11,99],[50,999]], 'arredonda');
    const n = rand(fx[1], fx[0]);
    const un = n % 10;
    const dez = Math.floor(n / 10) * 10;
    const resp = un >= 5 ? dez + 10 : dez;
    jogoState.resposta = resp; jogoState.n = n;
    const opcoes = new Set([resp, dez, dez + 10, Math.max(0, dez - 10), dez + 20]);
    const arr = [...opcoes].slice(0, 4).sort(() => Math.random() - 0.5);
    document.getElementById('jogo-conteudo').innerHTML = `
      <div class="pergunta">Arredonde <span class="grande">${n}</span> para a dezena mais próxima</div>
      <div class="opcoes q4">${arr.map(o => `<button onclick="JOGOS.arredonda.conferir(${o})" style="font-size:26px">${o}</button>`).join('')}</div>
      <div class="feedback" id="feedback"></div>`;
  },
  conferir(escolha) {
    if (escolha === jogoState.resposta) feedbackAcerto(`Isso! ${jogoState.n} → ${escolha}`);
    else feedbackErro(`Era ${jogoState.resposta}`, DICAS.arredonda(jogoState.n, jogoState.resposta));
  }
};

initJogos();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
