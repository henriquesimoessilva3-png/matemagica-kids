<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="sunnyBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="0.5" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff7e82"/>
    </linearGradient>
    <linearGradient id="brandPlayful" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d87"/>
      <stop offset="0.5" stop-color="#6e3fff"/>
      <stop offset="1" stop-color="#00b7ff"/>
    </linearGradient>
    <filter id="shadowBig" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Sunny gradient background -->
  <rect width="1000" height="1000" fill="url(#sunnyBg)"/>

  <!-- Decorative circles / bubbles -->
  <circle cx="120" cy="120" r="80" fill="#fff" opacity="0.35"/>
  <circle cx="880" cy="160" r="50" fill="#fff" opacity="0.35"/>
  <circle cx="930" cy="850" r="95" fill="#fff" opacity="0.3"/>
  <circle cx="80" cy="830" r="60" fill="#fff" opacity="0.4"/>
  <circle cx="150" cy="520" r="30" fill="#fff" opacity="0.4"/>
  <circle cx="870" cy="500" r="40" fill="#fff" opacity="0.35"/>

  <!-- Big floating number bubbles -->
  <g filter="url(#shadowBig)">
    <circle cx="220" cy="280" r="55" fill="#6e3fff"/>
    <text x="220" y="300" text-anchor="middle" font-size="58" fill="#fff" font-family="Arial, sans-serif" font-weight="900">7</text>
  </g>
  <g filter="url(#shadowBig)">
    <circle cx="790" cy="320" r="50" fill="#ff2d87"/>
    <text x="790" y="338" text-anchor="middle" font-size="52" fill="#fff" font-family="Arial, sans-serif" font-weight="900">+</text>
  </g>
  <g filter="url(#shadowBig)">
    <circle cx="760" cy="700" r="60" fill="#00b7ff"/>
    <text x="760" y="722" text-anchor="middle" font-size="62" fill="#fff" font-family="Arial, sans-serif" font-weight="900">3</text>
  </g>
  <g filter="url(#shadowBig)">
    <circle cx="200" cy="700" r="48" fill="#2ebd7c"/>
    <text x="200" y="718" text-anchor="middle" font-size="48" fill="#fff" font-family="Arial, sans-serif" font-weight="900">×</text>
  </g>

  <!-- Sparkles -->
  <text x="380" y="200" font-size="48" fill="#fff">✨</text>
  <text x="620" y="220" font-size="42" fill="#fff">✨</text>
  <text x="500" y="880" font-size="40" fill="#fff">✨</text>

  <!-- Brand name -->
  <text x="500" y="500" text-anchor="middle" font-size="130" font-family="Arial, sans-serif" font-weight="900" fill="url(#brandPlayful)" filter="url(#shadowBig)" letter-spacing="-1">Matemágica</text>

  <!-- Tagline -->
  <text x="500" y="580" text-anchor="middle" font-size="36" font-family="Arial, sans-serif" font-weight="800" fill="#3b1a5f">o app que a criança pede pra jogar</text>

  <!-- Bottom badges -->
  <g transform="translate(250,830)">
    <rect x="0" y="0" width="170" height="60" rx="30" fill="#6e3fff" filter="url(#shadowBig)"/>
    <text x="85" y="40" text-anchor="middle" font-size="24" font-family="Arial, sans-serif" font-weight="900" fill="#fff">BNCC</text>
  </g>
  <g transform="translate(430,830)">
    <rect x="0" y="0" width="170" height="60" rx="30" fill="#ff2d87" filter="url(#shadowBig)"/>
    <text x="85" y="40" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" font-weight="900" fill="#fff">1º – 5º ANO</text>
  </g>
  <g transform="translate(610,830)">
    <rect x="0" y="0" width="170" height="60" rx="30" fill="#00b7ff" filter="url(#shadowBig)"/>
    <text x="85" y="40" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" font-weight="900" fill="#fff">R$ 17 pra sempre</text>
  </g>
</svg>
